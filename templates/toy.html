<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Somphea Reak - Toy Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Moul&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', 'Kantumruy Pro', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #fcfbf9;
        }
        h1, h2, h3, h4, .khmer-title { font-family: 'Moul', serif; }
        .pka-chan-bg {
            background-color: #fdfbf7;
            background-image: radial-gradient(#ea580c 0.5px, transparent 0.5px), radial-gradient(#ea580c 0.5px, #fdfbf7 0.5px);
            background-size: 20px 20px; background-position: 0 0, 10px 10px; opacity: 0.5;
            position: fixed; inset: 0; z-index: -1;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        #category-modal { transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); will-change: transform; }
        
        .sticky-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025); }
        
        .mask-fade-right {
            -webkit-mask-image: linear-gradient(to right, black 85%, transparent 100%);
            mask-image: linear-gradient(to right, black 85%, transparent 100%);
        }
    </style>
</head>
<body class="text-gray-900 pb-20">

    <div class="pka-chan-bg"></div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" style="pointer-events: none;" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-[4000] bg-black/90 text-white px-6 py-3 rounded-full flex items-center gap-3 shadow-2xl opacity-0 transition-opacity duration-200 scale-90">
        <i id="toast-icon" class="fa-solid fa-circle-check text-green-400"></i>
        <span id="toast-text" class="text-xs font-bold uppercase tracking-widest font-['Kantumruy_Pro']">Added</span>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loadingOverlay" style="display: none;" class="fixed inset-0 z-[5000] bg-black/90 backdrop-blur-md flex-col items-center justify-center text-white">
        <div class="w-12 h-12 border-4 border-[#ea580c] border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-xs font-black uppercase tracking-[0.3em] font-['Moul']">កំពុងរៀបចំ...</p>
    </div>

    <!-- IMAGE VIEWER MODAL (FULL SCREEN) -->
    <div id="image-viewer-modal" class="fixed inset-0 z-[6000] bg-black hidden flex-col items-center justify-center transition-opacity">
        <div class="absolute top-0 left-0 w-full p-4 flex items-center justify-start gap-4 z-20 bg-gradient-to-b from-black/50 to-transparent">
            <button onclick="closeImageViewer()" class="w-10 h-10 flex items-center justify-center bg-white/10 rounded-full text-white hover:bg-white/20 transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <button onclick="closeImageViewer(); openCart();" class="relative w-10 h-10 flex items-center justify-center bg-white/10 rounded-full text-white hover:bg-white/20 transition-colors">
                <i class="fa-solid fa-cart-shopping text-lg"></i>
                <span class="absolute -top-1 -right-1 bg-[#ea580c] text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center shadow-md hidden cart-badge-count">0</span>
            </button>
        </div>
        <img id="viewer-img" src="" class="w-full h-full object-contain relative z-10">
    </div>

    <!-- 🌟 UNIFIED STICKY HEADER (STORE - BACK BUTTON ON LEFT) 🌟 -->
    <header class="sticky top-0 z-[100] bg-white/95 backdrop-blur-xl border-b border-gray-100 px-3 py-2.5 flex items-center justify-between shadow-sm">
        
        <!-- Left: Back Button -->
        <a href="/" class="w-9 h-9 flex items-center justify-center bg-gray-50 rounded-full text-gray-500 border border-gray-100 active:scale-90 transition-transform shrink-0 hover:bg-gray-100">
            <i class="fa-solid fa-arrow-left text-xs"></i>
        </a>
        
        <!-- Center: Logo + Title -->
        <div class="flex items-center justify-center flex-1 px-2 gap-2 min-w-0">
            <img src="/static/images/logo.jpg" onerror="this.src='/static/images/logo.png'" class="w-9 h-9 object-cover drop-shadow-sm shrink-0 rounded-full border border-gray-100" alt="Logo">
            <div class="flex flex-col justify-center text-left">
                <h1 class="text-[13px] sm:text-base font-black text-gray-900 leading-tight tracking-tight font-['Moul'] pb-0.5">
                    សម្ភារៈ <span class="font-['Plus_Jakarta_Sans'] text-xs whitespace-nowrap text-slate-600">- Somphea Reak</span>
                </h1>
                <p class="text-[8px] font-extrabold text-[#ea580c] uppercase tracking-widest leading-none">Toy Collection</p>
            </div>
        </div>
        
        <!-- Right: Universal Cart Button -->
        <button onclick="openCartDrawer()" class="relative w-9 h-9 flex items-center justify-center bg-white border border-gray-200 rounded-full text-gray-800 shadow-sm active:scale-90 transition-transform shrink-0 hover:text-[#ea580c]">
            <i class="fa-solid fa-cart-shopping text-xs"></i>
            <span id="cart-badge" class="absolute -top-1 -right-1 bg-[#ea580c] text-white text-[8px] font-black w-4 h-4 rounded-full flex items-center justify-center shadow-md hidden cart-badge-count">0</span>
        </button>
    </header>

    <!-- 🌟 SMART SEARCH & CATEGORY CONTROLS 🌟 -->
    <section class="sticky top-[58px] z-[90] bg-white/95 backdrop-blur-xl border-b border-gray-100 shadow-sm transition-all">
        <div class="px-4 pt-3 pb-3">
            <div class="relative flex items-center w-full max-w-5xl mx-auto">
                <i class="fa-solid fa-magnifying-glass absolute left-4 text-gray-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Search toys, categories, or variants..." 
                    class="w-full bg-white border-2 border-gray-100 rounded-full py-3 pl-10 pr-10 text-sm font-bold text-gray-800 outline-none focus:border-[#ea580c] focus:ring-4 focus:ring-orange-50 transition-all placeholder-gray-400 shadow-[inset_0_2px_4px_rgba(0,0,0,0.02)]">
                <button id="clearSearchBtn" onclick="clearSearch()" class="absolute right-3 text-gray-300 hover:text-gray-600 hidden transition-colors active:scale-90 p-1">
                    <i class="fa-solid fa-circle-xmark text-lg"></i>
                </button>
            </div>
        </div>

        <div class="flex items-center px-4 pb-3 gap-2 max-w-5xl mx-auto">
            <div id="category-filters" class="flex-1 flex overflow-x-auto gap-2 scrollbar-hide mask-fade-right pr-6"></div>
            <div class="h-6 w-px bg-gray-200 mx-1 shrink-0"></div>
            <button onclick="openCategoryModal()" class="shrink-0 w-10 h-10 flex items-center justify-center bg-gray-50 border border-gray-200 rounded-full text-gray-700 shadow-sm active:scale-90 transition-transform hover:bg-gray-100 relative group">
                <i class="fa-solid fa-layer-group text-sm"></i>
                <span class="absolute -top-8 right-0 bg-gray-800 text-white text-[10px] font-bold px-2 py-1 rounded opacity-0 group-hover:opacity-100 pointer-events-none whitespace-nowrap transition-opacity">All Categories</span>
            </button>
        </div>
    </section>

    <main class="p-4 max-w-5xl mx-auto min-h-[50vh]">
        <div id="product-grid" class="grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-4"></div>
    </main>

    <!-- 🌟 ALL CATEGORIES EXPLORER MODAL 🌟 -->
    <div id="category-modal" class="fixed inset-0 z-[1000] flex flex-col justify-end translate-y-full">
        <div class="absolute inset-0 bg-black/60 transition-opacity" onclick="closeCategoryModal()"></div>
        <div class="relative w-full max-h-[75vh] md:max-w-md md:mx-auto bg-gray-50 rounded-t-[2rem] shadow-2xl flex flex-col overflow-hidden">
            <div class="bg-white px-6 py-4 flex items-center justify-between border-b border-gray-100 z-10 sticky top-0 shadow-sm">
                <div>
                    <h2 class="text-lg font-black text-gray-900 font-['Moul']">ជ្រើសរើសប្រភេទ</h2>
                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mt-0.5">Explore All Categories</p>
                </div>
                <button onclick="closeCategoryModal()" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full text-gray-800 hover:text-red-500 active:scale-90 transition-all"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-4">
                <div id="full-category-grid" class="flex flex-col gap-2"></div>
            </div>
        </div>
    </div>

    <!-- 🌟 FULL SCREEN PRODUCT MODAL 🌟 -->
    <div id="product-modal" class="fixed inset-0 z-[1000] flex flex-col bg-white translate-y-full transition-transform duration-300 shadow-2xl">
        <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between bg-white/95 backdrop-blur-xl sticky top-0 z-30">
            <button onclick="closeProductModal()" class="w-10 h-10 flex items-center justify-center bg-gray-50 border border-gray-100 rounded-full text-gray-800 hover:bg-gray-100 transition-colors shrink-0">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </button>
            <div class="text-[16px] font-black text-gray-900 truncate flex-1 text-center font-['Moul'] px-2" id="modal-header-title">ទំនិញ</div>
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="openCartDrawer()" class="relative w-10 h-10 flex items-center justify-center bg-gray-50 border border-gray-100 rounded-full text-gray-800 hover:bg-gray-100 transition-colors">
                    <i class="fa-solid fa-cart-shopping text-md"></i>
                    <span class="absolute -top-1 -right-1 bg-[#ea580c] text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center shadow-md hidden cart-badge-count">0</span>
                </button>
                <button onclick="closeProductModal()" class="w-10 h-10 flex items-center justify-center bg-gray-50 border border-gray-100 rounded-full text-gray-800 hover:bg-red-50 hover:text-red-500 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
        </div>

        <div id="modal-scroll-body" class="flex-1 overflow-y-auto scrollbar-hide bg-gray-50 flex flex-col md:max-w-xl md:mx-auto md:w-full md:border-x md:border-gray-100">
            <div class="w-full h-[40vh] min-h-[250px] max-h-[380px] bg-white relative border-b border-gray-100 group shrink-0">
                <div id="modal-image-carousel" class="w-full h-full flex overflow-x-auto snap-x snap-mandatory scrollbar-hide" onscroll="handleModalCarouselScroll()"></div>
                <div class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-sm text-white px-2.5 py-1 rounded-full text-[10px] font-black tracking-wider z-10" id="carousel-indicator">1 / 1</div>
                <button onclick="openFullscreenViewer()" class="absolute bottom-3 right-3 bg-white/80 border border-gray-200 rounded-full w-8 h-8 flex items-center justify-center text-gray-800 shadow-sm backdrop-blur-sm z-10 active:scale-90"><i class="fa-solid fa-expand text-xs"></i></button>
            </div>

            <div class="bg-white border-b border-gray-100 pb-2">
                <div class="px-4 pt-4 pb-2 relative">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="text-[#ea580c] font-black text-2xl leading-none mb-1" id="sheet-price">$0.00</div>
                            <div class="text-xs text-gray-400 font-extrabold mb-1" id="sheet-price-khr">0៛</div>
                            <div class="text-[10px] text-gray-400 font-bold mb-2">Est. Price: <span id="sheet-est-price">--</span></div>
                        </div>
                        <div id="stock-label" class="text-[10px] font-black px-2 py-1 bg-gray-100 text-gray-500 rounded uppercase tracking-widest mt-1">In Stock</div>
                    </div>
                    <h2 class="text-sm font-black text-gray-900 leading-snug font-['Plus_Jakarta_Sans'] line-clamp-2" id="sheet-title">Product Title</h2>
                </div>

                <div class="px-4 py-2">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-xs font-black text-gray-900 font-['Kantumruy_Pro']">Color / Style <span class="text-gray-400 font-bold ml-1 text-[10px]">(ជ្រើសរើសម៉ូត)</span></h3>
                    </div>
                    <div id="variant-grid" class="grid grid-cols-4 gap-2 pb-2"></div>
                </div>
            </div>

            <div class="bg-white px-5 py-6 mt-2 border-t border-gray-100 pb-10">
                <div class="flex items-center gap-3 mb-5">
                    <div class="h-px bg-gray-200 flex-1"></div>
                    <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest text-center"><i class="fa-solid fa-sparkles text-orange-400 mr-1"></i> You Might Also Like</h3>
                    <div class="h-px bg-gray-200 flex-1"></div>
                </div>
                <div id="recommendations-grid" class="grid grid-cols-2 gap-3"></div>
            </div>
        </div>

        <div class="border-t border-gray-100 p-4 pb-6 bg-white shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)] z-30 md:max-w-xl md:mx-auto md:w-full md:border-x">
            <div class="flex justify-between items-center mb-4 px-1 gap-4">
                <div class="flex-1 min-w-0">
                    <div class="text-sm font-bold text-gray-900 line-clamp-1" id="bottom-variant-name">...</div>
                    <div class="text-[13px] text-[#ea580c] font-black mt-0.5" id="bottom-price-stock">...</div>
                </div>
                <div class="flex items-center gap-3 bg-gray-50 rounded-xl border border-gray-200 p-1 shrink-0">
                    <button onclick="updateModalQty(-1)" class="w-9 h-9 flex items-center justify-center bg-white rounded-lg shadow-sm text-gray-600 hover:text-[#ea580c] active:scale-95 transition-all"><i class="fa-solid fa-minus text-xs"></i></button>
                    <span id="modal-qty" class="font-black text-base w-6 text-center">1</span>
                    <button onclick="updateModalQty(1)" class="w-9 h-9 flex items-center justify-center bg-white rounded-lg shadow-sm text-gray-600 hover:text-[#ea580c] active:scale-95 transition-all"><i class="fa-solid fa-plus text-xs"></i></button>
                </div>
            </div>
            
            <button id="add-to-cart-btn" onclick="addToCartFromModal()" class="w-full bg-[#ea580c] text-white font-black py-4 rounded-2xl shadow-xl shadow-orange-500/30 text-sm active:scale-95 transition-all flex items-center justify-center gap-2 font-['Kantumruy_Pro'] tracking-wide disabled:active:scale-100 disabled:opacity-95">
                <i class="fa-solid fa-cart-plus"></i> បញ្ចូលទៅកន្ត្រក (Add to Cart)
            </button>
        </div>
    </div>

    <!-- Inject the Independent Cart Component -->
    {% include 'components/cart.html' %}

    <script>
        const RATE = 4000;
        let allProducts = [];
        let currentModalProduct = null;
        let currentVariantIndex = 0;
        let modalQty = 1;
        let isModalImageScrolling = false;
        let modalScrollTimeout;

        // Search & Smart Filter State
        let activeCategory = 'All';
        let currentSearchQuery = '';

        async function fetchProducts() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            try {
                const res = await fetch('/api/products/toy');
                if(!res.ok) throw new Error("API Connection Failed.");
                const data = await res.json();
                
                // Extremely safe assignment to prevent crashes if 'products' is undefined.
                allProducts = (data.products || []).filter(p => p.is_visible !== false && p.is_visible !== 0);
            } catch (e) {
                console.error("API Error - Could not load products", e);
                allProducts = []; // Failsafe empty array
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
            renderCategoryFilters();
            renderProducts();
            
            // Force re-fetch of local storage for cart UI
            if (typeof updateCartBadge === 'function') updateCartBadge();
        }

        // Add a focus listener specifically for stores so when user swipes back, cart syncs
        window.addEventListener('focus', () => { if(typeof updateCartBadge === 'function') updateCartBadge(); });
        window.addEventListener('pageshow', () => { if(typeof updateCartBadge === 'function') updateCartBadge(); });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearchQuery = e.target.value;
            const clearBtn = document.getElementById('clearSearchBtn');
            if (currentSearchQuery.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');
            renderProducts();
        });

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            currentSearchQuery = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderProducts();
        }

        function setCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.strip-btn').forEach(b => {
                if(b.dataset.cat === cat) {
                    b.classList.add('bg-gray-900', 'text-white', 'border-gray-900');
                    b.classList.remove('bg-white', 'text-gray-600', 'border-gray-200', 'hover:bg-gray-50');
                } else {
                    b.classList.remove('bg-gray-900', 'text-white', 'border-gray-900');
                    b.classList.add('bg-white', 'text-gray-600', 'border-gray-200', 'hover:bg-gray-50');
                }
            });
            const activeBtn = document.querySelector(`.strip-btn[data-cat="${cat}"]`);
            if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            closeCategoryModal();
            renderProducts();
        }

        function openCategoryModal() { document.getElementById('category-modal').classList.remove('translate-y-full'); }
        function closeCategoryModal() { document.getElementById('category-modal').classList.add('translate-y-full'); }

        function renderCategoryFilters() {
            let cats = new Set(['All']);
            allProducts.forEach(p => {
                if(p.category) {
                    p.category.split(',').forEach(c => { const trimmed = c.trim(); if (trimmed) cats.add(trimmed); });
                }
                const variants = p.variants || [];
                variants.forEach(v => {
                    if(v.category) v.category.split(',').forEach(c => { const trimmed = c.trim(); if (trimmed) cats.add(trimmed); });
                });
            });

            const catArray = Array.from(cats).sort((a, b) => {
                if(a === 'All') return -1;
                if(b === 'All') return 1;
                return a.localeCompare(b);
            });

            document.getElementById('category-filters').innerHTML = catArray.map(c => 
                `<button data-cat="${c}" onclick="setCategory('${c}')" class="strip-btn px-4 py-1.5 rounded-full border ${c === activeCategory ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'} text-[11px] font-bold uppercase tracking-wider whitespace-nowrap transition-colors shadow-sm flex-shrink-0">${c}</button>`
            ).join('');

            document.getElementById('full-category-grid').innerHTML = catArray.map(c => 
                `<button onclick="setCategory('${c}')" class="w-full px-5 py-4 rounded-xl border ${c === activeCategory ? 'bg-orange-50 border-[#ea580c] text-[#ea580c] shadow-sm' : 'bg-white text-gray-700 border-gray-200 hover:border-gray-300'} text-sm font-black tracking-wide text-left flex items-center justify-between transition-all group">
                    <span class="font-['Plus_Jakarta_Sans']">${c}</span>
                    <div class="w-6 h-6 rounded-full flex items-center justify-center ${c === activeCategory ? 'bg-[#ea580c] text-white' : 'bg-gray-100 text-gray-400 group-hover:bg-gray-200'} transition-colors">
                        <i class="fa-solid ${c === activeCategory ? 'fa-check' : 'fa-chevron-right'} text-[10px]"></i>
                    </div>
                </button>`
            ).join('');
        }

        function renderProducts() {
            let filtered = allProducts;
            if (activeCategory !== 'All') {
                const targetCatLower = activeCategory.toLowerCase();
                filtered = filtered.filter(p => {
                    if (p.category && p.category.split(',').map(c => c.trim().toLowerCase()).includes(targetCatLower)) return true;
                    if (p.variants) {
                        return p.variants.some(v => v.category && v.category.split(',').map(c => c.trim().toLowerCase()).includes(targetCatLower));
                    }
                    return false;
                });
            }

            filtered = filtered.map(p => {
                let displayImage = p.thumbnail; 
                let matchedVariantIndex = 0;
                let variants = p.variants || [];
                
                if (currentSearchQuery.trim() !== '') {
                    const q = currentSearchQuery.toLowerCase().trim();
                    const vIndex = variants.findIndex(v => v.name && v.name.toLowerCase().includes(q));
                    
                    if (vIndex !== -1) { 
                        matchedVariantIndex = vIndex; 
                        displayImage = variants[vIndex].image || displayImage; 
                    } else if (p.use_custom_thumbnail) {
                        displayImage = p.thumbnail;
                    } else if (variants.length > 0) {
                        displayImage = variants[0].image || p.thumbnail;
                    }
                } else {
                    if (p.use_custom_thumbnail) {
                        displayImage = p.thumbnail;
                    } else if (variants.length > 0) {
                        displayImage = variants[0].image || p.thumbnail;
                    }
                }
                return { ...p, displayImage, matchedVariantIndex };
            });

            if (currentSearchQuery.trim() !== '') {
                const q = currentSearchQuery.toLowerCase().trim();
                filtered = filtered.filter(p => {
                    const titleMatch = (p.title && p.title.toLowerCase().includes(q)) || (p.category && p.category.toLowerCase().includes(q));
                    const variantMatch = p.variants && p.variants.some(v => v.name && v.name.toLowerCase().includes(q));
                    return titleMatch || p.matchedVariantIndex > 0 || variantMatch;
                });
            }

            const grid = document.getElementById('product-grid');
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-2 md:col-span-3 lg:col-span-4 flex flex-col items-center justify-center py-20 opacity-80">
                        <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-4"><i class="fa-solid fa-magnifying-glass-minus text-3xl text-gray-400"></i></div>
                        <h3 class="text-sm font-black text-gray-800 uppercase tracking-widest font-['Moul']">រកមិនឃើញទំនិញទេ</h3>
                    </div>`;
                return;
            }
            
            grid.innerHTML = filtered.map((p, index) => {
                let variants = p.variants || [];
                const vIndex = p.matchedVariantIndex || 0;
                let image = p.displayImage;
                
                let vDiscount = variants.length > 0 ? parseFloat(variants[vIndex].discount_percent) || 0 : 0;
                let mDiscount = parseFloat(p.discount_percent) || 0;
                let finalDiscountPercent = vDiscount > 0 ? vDiscount : mDiscount; 

                let basePriceUSD = variants.length > 0 ? parseFloat(variants[vIndex].price) : parseFloat(p.price);
                let finalPriceUSD = basePriceUSD;
                
                let badgeHtml = (index % 5 === 0) ? `<div class="absolute top-2 left-2 z-10 bg-red-500 text-white text-[8px] font-black px-2 py-1 rounded-md uppercase tracking-widest shadow-md animate-pulse">HOT</div>` : '';
                let priceHtml = '';

                if (finalDiscountPercent > 0) {
                    finalPriceUSD = basePriceUSD - (basePriceUSD * finalDiscountPercent / 100);
                    badgeHtml = `<div class="absolute top-2 left-2 z-10 bg-red-600 text-white text-[8px] font-black px-2 py-1 rounded-md shadow-md leading-none">SALE -${Math.round(finalDiscountPercent)}%</div>`;
                    priceHtml = `
                        <div class="flex flex-col">
                            <span class="text-[9px] font-bold text-gray-400 line-through leading-none mb-0.5">$${basePriceUSD.toFixed(2)}</span>
                            <span class="font-black text-[13px] text-red-600 leading-none">$${finalPriceUSD.toFixed(2)}</span>
                            <span class="text-[8px] font-bold text-gray-400 mt-0.5">${Math.round(finalPriceUSD * RATE).toLocaleString()}៛</span>
                        </div>
                    `;
                } else {
                    priceHtml = `
                        <div class="flex flex-col">
                            <span class="font-black text-sm text-[#ea580c] leading-tight">$${finalPriceUSD.toFixed(2)}</span>
                            <span class="text-[8px] font-bold text-gray-400">${Math.round(finalPriceUSD * RATE).toLocaleString()}៛</span>
                        </div>
                    `;
                }

                return `
                <div onclick="openProductModal(${p.id}, ${vIndex})" class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex flex-col cursor-pointer active:scale-95 transition-all hover:shadow-xl group">
                    <div class="aspect-[4/5] bg-gray-50 relative overflow-hidden flex items-center justify-center p-2">
                        ${badgeHtml}
                        <img src="${image}" class="max-w-full max-h-full object-contain mix-blend-multiply group-hover:scale-110 transition-transform duration-500">
                    </div>
                    <div class="p-3 flex flex-col flex-grow bg-white relative z-10">
                        <h3 class="font-black text-xs text-gray-900 line-clamp-2 mb-1 font-['Plus_Jakarta_Sans'] leading-tight group-hover:text-[#ea580c] transition-colors">${p.title}</h3>
                        <div class="mt-auto flex justify-between items-end pt-2">
                            ${priceHtml}
                            <div class="w-7 h-7 bg-gray-50 border border-gray-100 rounded-full flex items-center justify-center text-gray-600 group-hover:bg-[#ea580c] group-hover:text-white group-hover:border-[#ea580c] transition-all shadow-sm"><i class="fa-solid fa-plus text-[10px]"></i></div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // =====================================
        // MODAL WITH GALLERY IMAGES INJECTED
        // =====================================
        function openProductModal(id, initialVariantIndex = 0) {
            currentModalProduct = allProducts.find(p => p.id === id);
            if(!currentModalProduct) return;
            
            document.body.style.overflow = 'hidden'; 
            document.getElementById('sheet-title').innerText = currentModalProduct.title;
            
            currentVariantIndex = initialVariantIndex; 
            modalQty = 1;
            document.getElementById('modal-qty').innerText = modalQty;
            
            let variants = currentModalProduct.variants || [];
            if(!variants || variants.length === 0) variants = [{ name: "Standard", price: currentModalProduct.price, stock: currentModalProduct.stock, image: currentModalProduct.thumbnail }];
            currentModalProduct._activeVariants = variants;

            let allImages = [];
            
            // 1. Add Custom Thumbnail explicitly if available and activated
            if (currentModalProduct.use_custom_thumbnail && currentModalProduct.thumbnail) {
                allImages.push(currentModalProduct.thumbnail);
            }
            
            // 2. Safely push Variant Photos
            variants.forEach(v => { 
                if (v.image && !allImages.includes(v.image)) allImages.push(v.image); 
            });
            
            // 3. Add Extra Gallery Pictures
            if (currentModalProduct.detail_images && Array.isArray(currentModalProduct.detail_images)) {
                currentModalProduct.detail_images.forEach(img => { 
                    if (img && !allImages.includes(img)) allImages.push(img); 
                });
            }
            
            if (allImages.length === 0) allImages.push('https://via.placeholder.com/400');
            currentModalProduct._allDetailImages = allImages;

            const carousel = document.getElementById('modal-image-carousel');
            carousel.innerHTML = allImages.map((imgUrl, idx) => `
                <div class="min-w-full h-full snap-center flex items-center justify-center p-3 relative">
                    <img src="${imgUrl}" class="max-w-full max-h-full object-contain mix-blend-multiply">
                    ${idx === 0 ? '<span class="absolute top-3 left-3 bg-black/60 text-white text-[8px] font-black px-2 py-0.5 rounded uppercase tracking-wider shadow-sm">Preview</span>' : `<span class="absolute top-3 left-3 bg-blue-600/90 text-white text-[8px] font-black px-2 py-0.5 rounded uppercase tracking-wider shadow-sm">Gallery Photo #${idx}</span>`}
                </div>
            `).join('');

            const indicator = document.getElementById('carousel-indicator');
            if(indicator) indicator.innerText = `1 / ${allImages.length}`;

            const grid = document.getElementById('variant-grid');
            grid.innerHTML = variants.map((v, i) => {
                const img = v.image || currentModalProduct.thumbnail;
                const name = v.name || `Style ${i + 1}`;
                return `
                <div onclick="selectVariant(${i})" id="var-btn-${i}" class="variant-btn w-full flex flex-col items-center p-1 border-2 rounded-[10px] cursor-pointer transition-all bg-white border-gray-100 hover:border-gray-300 relative group shadow-sm">
                    <div class="w-full aspect-square rounded-lg overflow-hidden bg-gray-50 mb-1 relative border border-gray-100/50"><img src="${img}" class="w-full h-full object-cover mix-blend-multiply"></div>
                    <div class="w-full flex items-center justify-center text-center px-0.5"><span id="var-text-${i}" class="text-[9px] font-bold text-gray-700 line-clamp-2 leading-tight">${name}</span></div>
                    <div id="var-check-${i}" class="absolute right-1 top-1 w-3.5 h-3.5 rounded-full bg-[#ea580c] text-white flex items-center justify-center opacity-0 scale-50 transition-all duration-200 shadow-sm"><i class="fa-solid fa-check text-[8px]"></i></div>
                </div>`;
            }).join('');

            updateVariantUIOnly(initialVariantIndex, true);
            renderRecommendations(id);

            const modal = document.getElementById('product-modal');
            modal.classList.remove('invisible');
            document.getElementById('modal-scroll-body').scrollTop = 0;
            setTimeout(() => { modal.classList.remove('translate-y-full'); }, 10);
        }

        function closeProductModal() { 
            const modal = document.getElementById('product-modal');
            modal.classList.add('translate-y-full');
            setTimeout(() => { modal.classList.add('invisible'); document.body.style.overflow = ''; }, 300); 
        }

        function handleModalCarouselScroll() {
            const carousel = document.getElementById('modal-image-carousel');
            if(!carousel) return;
            const index = Math.round(carousel.scrollLeft / carousel.clientWidth);
            const indicator = document.getElementById('carousel-indicator');
            if(indicator) indicator.innerText = `${index + 1} / ${currentModalProduct._allDetailImages.length}`;

            if (isModalImageScrolling) return; 
            clearTimeout(modalScrollTimeout);
            modalScrollTimeout = setTimeout(() => {
                let targetVariantIndex = index;
                if (currentModalProduct.use_custom_thumbnail) targetVariantIndex = index - 1; 

                if (targetVariantIndex !== currentVariantIndex && targetVariantIndex >= 0 && targetVariantIndex < currentModalProduct._activeVariants.length) {
                    updateVariantUIOnly(targetVariantIndex, false);
                }
            }, 50);
        }

        function selectVariant(idx) { updateVariantUIOnly(idx, true); }

        function updateVariantUIOnly(idx, scrollImage = false) {
            currentVariantIndex = idx;
            const variants = currentModalProduct._activeVariants;
            const v = variants[idx];
            
            let vDiscount = parseFloat(v.discount_percent) || 0;
            let mDiscount = parseFloat(currentModalProduct.discount_percent) || 0;
            let finalDiscountPercent = vDiscount > 0 ? vDiscount : mDiscount; 

            const basePriceUSD = parseFloat(v.price || currentModalProduct.price);
            let finalPriceUSD = finalDiscountPercent > 0 ? basePriceUSD - (basePriceUSD * finalDiscountPercent / 100) : basePriceUSD;
            
            const priceUSDStr = `$${finalPriceUSD.toFixed(2)}`;
            const priceKHRStr = `${Math.round(finalPriceUSD * RATE).toLocaleString()}៛`;
            const estPrice = `$${(finalPriceUSD * 0.95).toFixed(2)}`;
            const name = v.name || `Style ${idx + 1}`;
            
            if (finalDiscountPercent > 0) {
                document.getElementById('sheet-price').innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-red-600">${priceUSDStr}</span>
                        <span class="bg-red-600 text-white text-[10px] px-2 py-0.5 rounded shadow-sm align-middle leading-none">SALE -${Math.round(finalDiscountPercent)}%</span>
                    </div>
                `;
                document.getElementById('sheet-price-khr').innerHTML = `<span class="text-gray-400 line-through mr-2">$${basePriceUSD.toFixed(2)}</span><span class="text-gray-500 font-bold">${priceKHRStr}</span>`;
            } else {
                document.getElementById('sheet-price').innerHTML = `<span class="text-[#ea580c]">${priceUSDStr}</span>`;
                document.getElementById('sheet-price-khr').innerText = priceKHRStr;
            }

            document.getElementById('sheet-est-price').innerText = estPrice;
            document.getElementById('bottom-variant-name').innerText = name;
            document.getElementById('bottom-price-stock').innerText = priceUSDStr;

            const variantStock = v.stock !== undefined && v.stock !== null ? parseInt(v.stock) : (currentModalProduct.stock !== undefined && currentModalProduct.stock !== null ? parseInt(currentModalProduct.stock) : 1);
            const addToCartBtn = document.getElementById('add-to-cart-btn');
            const stockLabel = document.getElementById('stock-label');

            if (isNaN(variantStock) || variantStock > 0) {
                addToCartBtn.classList.remove('bg-gray-400');
                addToCartBtn.classList.add('bg-[#ea580c]', 'shadow-orange-500/30');
                addToCartBtn.innerHTML = `<i class="fa-solid fa-cart-plus"></i> បញ្ចូលទៅកន្ត្រក (Add to Cart)`;
                addToCartBtn.disabled = false;
                stockLabel.className = 'text-[10px] font-black px-2 py-1 bg-gray-100 text-gray-500 rounded uppercase tracking-widest mt-1';
                stockLabel.innerHTML = `In Stock: ${isNaN(variantStock) ? 'Yes' : variantStock}`;
            } else {
                addToCartBtn.classList.remove('bg-[#ea580c]', 'shadow-orange-500/30');
                addToCartBtn.classList.add('bg-gray-400');
                addToCartBtn.innerHTML = `<i class="fa-solid fa-ban"></i> អស់ពីស្តុក (Out of Stock)`;
                addToCartBtn.disabled = true;
                stockLabel.className = 'text-[10px] font-black px-2 py-1 bg-red-50 text-red-500 rounded uppercase tracking-widest mt-1';
                stockLabel.innerHTML = `Out of Stock`;
            }
            
            if (scrollImage && variants.length > 1) {
                isModalImageScrolling = true;
                const carousel = document.getElementById('modal-image-carousel');
                if (carousel) {
                    let targetScrollIndex = idx;
                    if (currentModalProduct.use_custom_thumbnail && currentModalProduct.thumbnail) {
                        targetScrollIndex = idx + 1; // offset by 1 because thumbnail is at index 0
                    }
                    carousel.scrollTo({ left: carousel.clientWidth * targetScrollIndex, behavior: 'smooth' });
                    setTimeout(() => carousel.scrollTo({ left: carousel.clientWidth * targetScrollIndex, behavior: 'auto' }), 50); 
                }
                setTimeout(() => { isModalImageScrolling = false; }, 400); 
            }
            
            document.querySelectorAll('.variant-btn').forEach((btn, i) => {
                const textSpan = document.getElementById(`var-text-${i}`);
                const checkIcon = document.getElementById(`var-check-${i}`);
                if(i === idx) {
                    btn.classList.add('border-[#ea580c]', 'bg-orange-50/40'); btn.classList.remove('border-gray-100', 'bg-white', 'hover:border-gray-300');
                    if(textSpan) { textSpan.classList.add('text-[#ea580c]'); textSpan.classList.remove('text-gray-700'); }
                    if(checkIcon) { checkIcon.classList.remove('opacity-0', 'scale-50'); checkIcon.classList.add('opacity-100', 'scale-100'); }
                } else {
                    btn.classList.remove('border-[#ea580c]', 'bg-orange-50/40'); btn.classList.add('border-gray-100', 'bg-white', 'hover:border-gray-300');
                    if(textSpan) { textSpan.classList.remove('text-[#ea580c]'); textSpan.classList.add('text-gray-700'); }
                    if(checkIcon) { checkIcon.classList.add('opacity-0', 'scale-50'); checkIcon.classList.remove('opacity-100', 'scale-100'); }
                }
            });
        }

        function renderRecommendations(excludeId) {
            const available = allProducts.filter(p => p.id !== excludeId);
            const shuffled = available.sort(() => 0.5 - Math.random());
            const grid = document.getElementById('recommendations-grid');
            
            grid.innerHTML = shuffled.slice(0, 4).map(p => {
                let variants = p.variants || [];
                let vDiscount = variants.length > 0 ? parseFloat(variants[0].discount_percent) || 0 : 0;
                let mDiscount = parseFloat(p.discount_percent) || 0;
                let finalDiscountPercent = vDiscount > 0 ? vDiscount : mDiscount; 
                
                let basePriceUSD = variants.length > 0 ? parseFloat(variants[0].price) : parseFloat(p.price);
                let finalPriceUSD = finalDiscountPercent > 0 ? basePriceUSD - (basePriceUSD * finalDiscountPercent / 100) : basePriceUSD;
                let badgeHtml = finalDiscountPercent > 0 ? `<div class="absolute top-1 right-1 z-10 bg-red-600 text-white text-[8px] font-black px-1.5 py-0.5 rounded shadow-sm leading-none">-${Math.round(finalDiscountPercent)}%</div>` : '';

                const image = p.use_custom_thumbnail ? p.thumbnail : (variants.length > 0 ? variants[0].image : p.thumbnail);
                return `
                <div onclick="swapToRecommendation(${p.id})" class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex flex-col cursor-pointer active:scale-95 transition-all hover:border-[#ea580c] group relative">
                    ${badgeHtml}
                    <div class="aspect-[4/5] bg-gray-50 relative p-3"><img src="${image}" class="w-full h-full object-contain mix-blend-multiply group-hover:scale-105 transition-transform duration-300"></div>
                    <div class="p-3 flex flex-col flex-grow bg-white">
                        <h3 class="font-bold text-[11px] text-gray-800 line-clamp-2 mb-1.5 font-['Plus_Jakarta_Sans'] leading-tight group-hover:text-[#ea580c] transition-colors">${p.title}</h3>
                        <span class="font-black text-sm text-[#ea580c] mt-auto">$${finalPriceUSD.toFixed(2)}</span>
                    </div>
                </div>`;
            }).join('');
        }

        function swapToRecommendation(newId) {
            document.getElementById('modal-scroll-body').scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => { openProductModal(newId); }, 150);
        }

        function updateModalQty(delta) {
            modalQty += delta;
            if(modalQty < 1) modalQty = 1; if(modalQty > 10) modalQty = 10; 
            document.getElementById('modal-qty').innerText = modalQty;
        }

        function addToCartFromModal() {
            if(!currentModalProduct) return;
            const variants = currentModalProduct._activeVariants; const v = variants[currentVariantIndex];
            const hasTrueVariants = (currentModalProduct.variants && currentModalProduct.variants.length > 0);
            const dbId = hasTrueVariants ? `${currentModalProduct.id}-${currentVariantIndex}` : `${currentModalProduct.id}-0`;
            
            let vDiscount = parseFloat(v.discount_percent) || 0;
            let mDiscount = parseFloat(currentModalProduct.discount_percent) || 0;
            let finalDiscountPercent = vDiscount > 0 ? vDiscount : mDiscount; 

            let basePriceUSD = parseFloat(v.price || currentModalProduct.price);
            let finalPriceUSD = finalDiscountPercent > 0 ? basePriceUSD - (basePriceUSD * finalDiscountPercent / 100) : basePriceUSD;
            
            const thumbnailImage = v.image || currentModalProduct.thumbnail;
            const stock = parseInt(v.stock !== undefined ? v.stock : currentModalProduct.stock);
            const styleName = v.name || (hasTrueVariants ? `Style ${currentVariantIndex + 1}` : "Standard");

            if(!isNaN(stock) && stock <= 0) return alert("Sorry, this exact variant is out of stock!");

            for(let i=0; i < modalQty; i++) {
                window.addToGlobalCart({
                    productId: currentModalProduct.id, variantId: dbId, 
                    name: `${currentModalProduct.title} - ${styleName}`,
                    price: finalPriceUSD, image: thumbnailImage, stock: isNaN(stock) ? 99 : stock,
                    type: 'option', mainVariantId: `${currentModalProduct.id}-0` 
                });
            }
            
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = "Added to Cart";
            toast.classList.remove('opacity-0', 'scale-90'); setTimeout(() => toast.classList.add('opacity-0', 'scale-90'), 1500);
            closeProductModal();
        }

        function openFullscreenViewer() {
            if(!currentModalProduct) return;
            const src = currentModalProduct._allDetailImages && currentModalProduct._allDetailImages.length > 0 
                ? currentModalProduct._allDetailImages[0] 
                : currentModalProduct.thumbnail;
            if (src) openImageViewer(src);
        }

        function openImageViewer(src) { 
            document.body.style.overflow = 'hidden';
            document.getElementById('viewer-img').src = src; 
            document.getElementById('image-viewer-modal').classList.remove('hidden'); document.getElementById('image-viewer-modal').classList.add('flex'); 
        }

        function closeImageViewer() { 
            if(document.getElementById('product-modal').classList.contains('invisible')) document.body.style.overflow = ''; 
            document.getElementById('image-viewer-modal').classList.add('hidden'); document.getElementById('image-viewer-modal').classList.remove('flex'); 
        }

        fetchProducts();
    </script>
</body>
</html>
