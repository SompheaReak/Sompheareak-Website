<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Somphea Reak - Minifigure Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Moul&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    
    body { 
        font-family: 'Plus Jakarta Sans', 'Kantumruy Pro', sans-serif; 
        -webkit-tap-highlight-color: transparent;
        background-color: #fcfbf9;
    }
    h1, h2, h3, h4, .khmer-title { font-family: 'Moul', serif; }
    .pka-chan-bg {
        background-color: #fdfbf7;
        background-image: radial-gradient(#ea580c 0.5px, transparent 0.5px), radial-gradient(#ea580c 0.5px, #fdfbf7 0.5px);
        background-size: 20px 20px; background-position: 0 0, 10px 10px; opacity: 0.5;
        position: fixed; inset: 0; z-index: -1;
    }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    
    .search-input {
        background: #f8fafc;
        border: 1.5px solid #e2e8f0;
        border-radius: 14px;
        transition: all 0.2s ease;
    }
    .search-input:focus {
        background: #ffffff;
        border-color: #ea580c;
        box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.1);
    }
  </style>
</head>
<body class="text-gray-900 pb-20">

  <div class="pka-chan-bg"></div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" style="pointer-events: none;" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-[4000] bg-black/90 text-white px-5 py-2.5 rounded-full flex items-center gap-2.5 shadow-2xl opacity-0 transition-all duration-200 scale-90">
    <i id="toast-icon" class="fa-solid fa-circle-check text-green-400 text-sm"></i>
    <span id="toast-text" class="text-[11px] font-bold uppercase tracking-widest font-['Kantumruy_Pro']">Added to Cart</span>
  </div>

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay" style="display: none;" class="fixed inset-0 z-[5000] bg-black/90 backdrop-blur-md hidden flex-col items-center justify-center text-white">
      <div class="w-10 h-10 border-4 border-[#ea580c] border-t-transparent rounded-full animate-spin mb-3"></div>
      <p class="text-[10px] font-black uppercase tracking-[0.3em] font-['Moul']">កំពុងរៀបចំ...</p>
  </div>

  <!-- IMAGE LIGHTBOX VIEWER -->
  <div id="image-viewer-modal" class="fixed inset-0 z-[6000] bg-black/95 hidden flex-col items-center justify-center p-4 backdrop-blur-sm transition-opacity">
      <button onclick="closeImageViewer()" class="absolute top-6 right-6 w-10 h-10 flex items-center justify-center bg-white/10 rounded-full text-white hover:bg-red-500 transition-colors"><i class="fa-solid fa-xmark text-lg"></i></button>
      <img id="viewer-img" src="" class="max-w-full max-h-[80vh] object-contain rounded-xl shadow-2xl">
  </div>

  <!-- 🌟 UNIFIED STICKY HEADER (STORE - BACK BUTTON ON LEFT) 🌟 -->
  <header class="sticky top-0 z-[100] bg-white/95 backdrop-blur-xl border-b border-gray-100 px-3 py-2.5 flex items-center justify-between shadow-sm">
      <a href="/" class="w-9 h-9 flex items-center justify-center bg-gray-50 rounded-full text-gray-500 border border-gray-100 active:scale-90 transition-transform shrink-0 hover:bg-gray-100">
          <i class="fa-solid fa-arrow-left text-xs"></i>
      </a>
      
      <div class="flex items-center justify-center flex-1 px-2 gap-2 min-w-0">
          <img src="/static/images/logo.jpg" onerror="this.src='/static/images/logo.png'" class="w-9 h-9 object-cover drop-shadow-sm shrink-0 rounded-full border border-gray-100" alt="Logo">
          <div class="flex flex-col justify-center text-left">
              <h1 class="text-[13px] sm:text-base font-black text-gray-900 leading-tight tracking-tight font-['Moul'] pb-0.5">
                  សម្ភារៈ <span class="font-['Plus_Jakarta_Sans'] text-xs whitespace-nowrap text-slate-600">- Somphea Reak</span>
              </h1>
              <p class="text-[8px] font-extrabold text-[#ea580c] uppercase tracking-widest leading-none">Minifigure Vault</p>
          </div>
      </div>
      
      <!-- Right: Universal Cart Button -->
      <button onclick="if(typeof window.openUniversalCart === 'function') window.openUniversalCart(); else if (typeof window.openCartDrawer === 'function') window.openCartDrawer();" class="relative w-9 h-9 flex items-center justify-center bg-white border border-gray-200 rounded-full text-gray-800 shadow-sm active:scale-90 transition-transform shrink-0 hover:text-[#ea580c]">
          <i class="fa-solid fa-cart-shopping text-xs"></i>
          <span id="cart-badge" class="cart-badge-count absolute -top-1 -right-1 bg-[#ea580c] text-white text-[8px] font-black w-4 h-4 rounded-full flex items-center justify-center shadow-md hidden border border-white">0</span>
      </button>
  </header>

  <!-- SEARCH & CATEGORY PILLS -->
  <section class="bg-white/95 backdrop-blur-xl border-b border-gray-100 sticky top-[57px] z-[95] px-2.5 py-2 space-y-2 shadow-sm">
      <div class="max-w-6xl mx-auto flex items-center gap-2">
          <div class="relative flex-1">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-[10px]"></i>
              <input type="text" id="minifig-search" oninput="handleSearchInput()" placeholder="Search figures..." class="search-input w-full pl-8 pr-7 py-1.5 text-[11px] font-bold outline-none text-gray-900 placeholder-gray-400">
              <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700">
                  <i class="fa-solid fa-circle-xmark text-xs"></i>
              </button>
          </div>
      </div>

      <div class="max-w-6xl mx-auto">
          <div id="category-filters" class="flex overflow-x-auto gap-1 scrollbar-hide">
              <button class="px-3 py-1 rounded-full bg-gray-900 text-white text-[9px] font-extrabold uppercase tracking-wider whitespace-nowrap shadow-sm">All (0)</button>
          </div>
      </div>
  </section>

  <!-- COUNTER -->
  <div class="max-w-6xl mx-auto px-3 pt-2.5 flex justify-between items-center text-[9px] font-extrabold text-gray-400 uppercase tracking-widest">
      <span id="results-count">Showing 0 Minifigures</span>
      <span class="text-emerald-600 flex items-center gap-1"><i class="fa-solid fa-circle text-[5px] animate-pulse"></i> In Stock</span>
  </div>

  <!-- 4 PRODUCTS PER ROW GRID -->
  <main class="p-2 sm:p-3 max-w-6xl mx-auto">
      <div id="product-grid" class="grid grid-cols-4 sm:grid-cols-4 lg:grid-cols-6 gap-1.5 sm:gap-2.5">
          <!-- Unpacked single Minifigures render here -->
      </div>
  </main>

  <!-- INCLUDE THE UNIFIED GLOBAL CART COMPONENT -->
  {% include 'components/cart.html' ignore missing %}

  <script>
    const RATE = 4000;
    let rawProducts = [];
    let unpackedFigures = [];
    
    let activeCategory = 'All';
    let activeSearchTerm = '';

    // Focus Listener to ensure cart badge updates when returning from other tabs
    window.addEventListener('focus', () => { if(typeof window.updateCartBadge === 'function') window.updateCartBadge(); });
    window.addEventListener('pageshow', () => { if(typeof window.updateCartBadge === 'function') window.updateCartBadge(); });

    async function fetchProducts() {
        document.getElementById('loadingOverlay').style.display = 'flex';
        try {
            const res = await fetch('/api/products/minifigure');
            const data = await res.json();
            rawProducts = data.products || [];
            
            unpackMinifigureGroups();
            renderCategoryFilters();
            applyFilters();
        } catch (e) {
            console.error("Error loading minifigures", e);
        } finally {
            document.getElementById('loadingOverlay').style.display = 'none';
        }
        if(typeof window.updateCartBadge === 'function') window.updateCartBadge();
    }

    /* AUTOMATIC UNPACKING OF GROUP UPLOADS INTO SINGLE BOXES */
    function unpackMinifigureGroups() {
        unpackedFigures = [];
        
        rawProducts.forEach(product => {
            let variants = product.parsed_variants || [];
            if(variants.length === 0 && product.variants) {
                try { variants = typeof product.variants === 'string' ? JSON.parse(product.variants) : product.variants; } catch(e){}
            }

            let discountPercent = parseFloat(product.discount_percent) || 0;

            if (variants && variants.length > 0) {
                variants.forEach((v, vIdx) => {
                    let figureName = v.name && v.name !== `Style ${vIdx + 1}` ? `${v.name}` : product.title;
                    if (!v.name || v.name.startsWith('Style ')) figureName = product.title ? `${product.title} #${vIdx + 1}` : `Minifigure #${product.id}-${vIdx + 1}`;

                    let figureCategory = v.category || product.category || 'General';
                    
                    let basePriceUSD = (parseFloat(v.price) || parseFloat(product.price) || 0);
                    let finalPriceUSD = basePriceUSD;
                    if(discountPercent > 0) { finalPriceUSD = basePriceUSD - (basePriceUSD * discountPercent / 100); }

                    unpackedFigures.push({
                        cartId: `${product.id}-${vIdx}`,
                        productId: product.id,
                        variantIndex: vIdx,
                        title: figureName,
                        originalPriceKHR: basePriceUSD * RATE,
                        priceKHR: finalPriceUSD * RATE,
                        priceUSD: finalPriceUSD, // Saved in USD for Universal Cart System
                        discountPercent: discountPercent,
                        stock: parseInt(v.stock) || 0,
                        image: v.image || product.thumbnail || product.image,
                        category: figureCategory
                    });
                });
            } else {
                let basePriceUSD = (parseFloat(product.price) || 0);
                let finalPriceUSD = basePriceUSD;
                if(discountPercent > 0) { finalPriceUSD = basePriceUSD - (basePriceUSD * discountPercent / 100); }

                unpackedFigures.push({
                    cartId: `${product.id}-0`,
                    productId: product.id,
                    variantIndex: 0,
                    title: product.title || `Minifigure #${product.id}`,
                    originalPriceKHR: basePriceUSD * RATE,
                    priceKHR: finalPriceUSD * RATE,
                    priceUSD: finalPriceUSD,
                    discountPercent: discountPercent,
                    stock: parseInt(product.stock) || 0,
                    image: product.image || product.thumbnail,
                    category: product.category || 'General'
                });
            }
        });
    }

    function renderCategoryFilters() {
        let catCounts = { 'All': unpackedFigures.length };
        unpackedFigures.forEach(fig => {
            if(fig.category) {
                fig.category.split(',').forEach(c => {
                    const trimmed = c.trim();
                    if(trimmed) catCounts[trimmed] = (catCounts[trimmed] || 0) + 1;
                });
            }
        });

        const container = document.getElementById('category-filters');
        container.innerHTML = Object.keys(catCounts).map(c => {
            const isSelected = c === activeCategory;
            return `<button onclick="setCategoryFilter('${c}', this)" class="filter-btn px-2.5 py-1 rounded-full ${isSelected ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'} text-[9px] font-extrabold uppercase tracking-wider whitespace-nowrap transition-all">
                ${c} <span class="opacity-60 text-[8px]">(${catCounts[c]})</span>
            </button>`;
        }).join('');
    }

    function setCategoryFilter(cat, btnEl) {
        activeCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => { 
            b.classList.remove('bg-gray-900', 'text-white'); 
            b.classList.add('bg-gray-100', 'text-gray-600'); 
        });
        if(btnEl) {
            btnEl.classList.add('bg-gray-900', 'text-white');
            btnEl.classList.remove('bg-gray-100', 'text-gray-600');
        }
        applyFilters();
    }

    function handleSearchInput() {
        const val = document.getElementById('minifig-search').value;
        activeSearchTerm = val.toLowerCase().trim();
        const clearBtn = document.getElementById('clear-search-btn');
        if (activeSearchTerm) clearBtn.classList.remove('hidden');
        else clearBtn.classList.add('hidden');
        applyFilters();
    }

    function clearSearch() {
        document.getElementById('minifig-search').value = '';
        activeSearchTerm = '';
        document.getElementById('clear-search-btn').classList.add('hidden');
        applyFilters();
    }

    function applyFilters() {
        let filtered = unpackedFigures.filter(fig => {
            const matchesCat = activeCategory === 'All' || (fig.category && fig.category.includes(activeCategory));
            const title = (fig.title || '').toLowerCase();
            const figId = String(fig.productId);
            const matchesSearch = !activeSearchTerm || title.includes(activeSearchTerm) || figId.includes(activeSearchTerm);
            return matchesCat && matchesSearch;
        });

        document.getElementById('results-count').innerText = `Showing ${filtered.length} of ${unpackedFigures.length} Minifigures`;
        renderProductsGrid(filtered);
    }

    /* RENDER 4 UNPACKED SINGLE BOXES PER ROW */
    function renderProductsGrid(figures) {
        const grid = document.getElementById('product-grid');
        
        if (figures.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-16 text-gray-400 font-bold uppercase text-xs tracking-widest">No Minifigures match your search.</div>`;
            return;
        }

        grid.innerHTML = figures.map((fig) => {
            const isSoldOut = fig.stock <= 0;
            
            let badgeHtml = '';
            let priceHtml = '';
            
            if(fig.discountPercent > 0) {
                badgeHtml = `<div class="absolute top-1 left-1 z-10 bg-red-600 text-white text-[8px] font-black px-1 py-0.5 rounded shadow-sm leading-none">SALE -${Math.round(fig.discountPercent)}%</div>`;
                priceHtml = `
                    <div class="flex flex-col">
                        <span class="text-[9px] font-bold text-gray-400 line-through leading-none mb-0.5">${fig.originalPriceKHR.toLocaleString()}៛</span>
                        <span class="font-black text-[11px] text-red-600 leading-none">${fig.priceKHR.toLocaleString()}៛</span>
                    </div>
                `;
            } else {
                priceHtml = `<span class="font-black text-[11px] text-[#ea580c] block mt-0.5">${fig.priceKHR.toLocaleString()}៛</span>`;
            }

            return `
            <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden flex flex-col relative group ${isSoldOut ? 'opacity-50' : ''}">
                ${badgeHtml}
                <!-- Single Figure Image (Click triggers lightbox viewer) -->
                <div class="aspect-square bg-gray-50 relative overflow-hidden flex items-center justify-center p-1 cursor-pointer" onclick="openImageViewer('${fig.image}')">
                    ${isSoldOut ? `<div class="absolute inset-0 bg-black/40 backdrop-blur-[1px] flex items-center justify-center z-10"><span class="bg-red-600 text-white text-[7px] font-black px-1.5 py-0.5 rounded uppercase tracking-widest">SOLD OUT</span></div>` : ''}
                    <img src="${fig.image}" class="max-w-full max-h-full object-contain mix-blend-multiply group-hover:scale-105 transition-transform duration-300">
                </div>

                <!-- Single Figure Box Details & Add Button -->
                <div class="p-1.5 flex flex-col flex-grow bg-white justify-between">
                    <div>
                        <h3 class="font-extrabold text-[10px] text-gray-900 line-clamp-1 leading-tight font-['Plus_Jakarta_Sans'] mb-1" title="${fig.title}">${fig.title}</h3>
                        ${priceHtml}
                    </div>

                    <!-- HOOKED UP TO UNIVERSAL CART COMPONENT -->
                    <button onclick="addToCartUnpacked('${fig.cartId}')" ${isSoldOut ? 'disabled' : ''} class="w-full mt-1.5 py-1 bg-gray-900 text-white hover:bg-[#ea580c] ${isSoldOut ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'active:scale-95'} rounded-lg text-[9px] font-extrabold uppercase tracking-wider transition-all flex items-center justify-center gap-1 shadow-sm">
                        <i class="fa-solid fa-plus text-[8px]"></i> Add
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    /* 🔥 PUSHES DIRECTLY TO THE GLOBAL CART.HTML COMPONENT 🔥 */
    function addToCartUnpacked(cartId) {
        const figure = unpackedFigures.find(f => f.cartId === cartId);
        if(!figure) return;
        if(figure.stock <= 0) return alert("Sorry, this minifigure is sold out!");

        // Route to cart.html logic
        if (typeof window.addToGlobalCart === 'function') {
            window.addToGlobalCart({
                productId: figure.productId,
                variantId: figure.cartId,
                name: figure.title,
                style: 'Single Figure',
                price: figure.priceUSD, // Must be USD for global cart Math
                image: figure.image,
                stock: figure.stock,
                type: 'option',
                qty: 1
            });
        }
        
        const toast = document.getElementById('toast');
        document.getElementById('toast-text').innerText = "Added to Cart";
        toast.classList.remove('opacity-0', 'scale-90'); 
        setTimeout(() => toast.classList.add('opacity-0', 'scale-90'), 1200);
    }

    function openImageViewer(src) { document.getElementById('viewer-img').src = src; document.getElementById('image-viewer-modal').classList.remove('hidden'); document.getElementById('image-viewer-modal').classList.add('flex'); }
    function closeImageViewer() { document.getElementById('image-viewer-modal').classList.add('hidden'); document.getElementById('image-viewer-modal').classList.remove('flex'); }

    fetchProducts();
  </script>
</body>
</html>
