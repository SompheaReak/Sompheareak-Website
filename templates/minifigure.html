<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Somphea Reak - Minifigure Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Moul&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    
    body { 
        font-family: 'Plus Jakarta Sans', 'Kantumruy Pro', sans-serif; 
        -webkit-tap-highlight-color: transparent;
        background-color: #fcfbf9;
    }
    h1, h2, h3, h4, .khmer-title { font-family: 'Moul', serif; }
    .pka-chan-bg {
        background-color: #fdfbf7;
        background-image: radial-gradient(#ea580c 0.5px, transparent 0.5px), radial-gradient(#ea580c 0.5px, #fdfbf7 0.5px);
        background-size: 20px 20px; background-position: 0 0, 10px 10px; opacity: 0.5;
        position: fixed; inset: 0; z-index: -1;
    }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    
    .search-input {
        background: #f8fafc;
        border: 1.5px solid #e2e8f0;
        border-radius: 14px;
        transition: all 0.2s ease;
    }
    .search-input:focus {
        background: #ffffff;
        border-color: #ea580c;
        box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.1);
    }

    /* FULL SCREEN Survey Modal Animations */
    #survey-modal { 
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease; 
        transform: translateY(0);
        opacity: 1;
    }
    .survey-hidden { 
        transform: translateY(100%) !important; 
        opacity: 0 !important; 
        pointer-events: none; 
    }
    
    .step-transition { transition: all 0.4s ease; }
    .step-out { opacity: 0; transform: translateX(-30px); pointer-events: none; position: absolute; width: 100%; top: 0; left: 0; }
    .step-in { opacity: 1; transform: translateX(0); position: relative; }
  </style>
</head>
<body class="text-gray-900 pb-20 overflow-x-hidden">

  <div class="pka-chan-bg"></div>

  <!-- ==================== FULL SCREEN SURVEY MODAL ==================== -->
  <div id="survey-modal" class="fixed inset-0 z-[8500] bg-white flex flex-col overflow-hidden survey-hidden">
      
      <!-- Close Button -->
      <button onclick="closeSurvey()" class="absolute top-5 right-5 w-10 h-10 flex items-center justify-center bg-gray-50 rounded-full text-gray-500 hover:text-red-500 hover:bg-red-50 transition-colors z-50 shadow-sm border border-gray-100">
          <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <div class="flex-1 overflow-y-auto px-5 pt-16 pb-32 relative">
          
          <!-- Step 1: Category Selection -->
          <div id="survey-step-1" class="step-transition step-in max-w-lg mx-auto">
              <h2 class="text-2xl sm:text-3xl font-black text-center mb-2 font-['Moul'] text-slate-800">ជ្រើសរើសប្រភេទMinifigure</h2>
              <p class="text-center text-[11px] sm:text-xs text-gray-400 font-extrabold mb-8 uppercase tracking-widest">Select one or more options</p>
              
              <!-- 6 Categories Grid -->
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4">
                  
                  <!-- Ninjago -->
                  <button id="cat-btn-Ninjago" onclick="toggleSurveyCategory('Ninjago')" class="survey-cat-btn group relative aspect-square rounded-3xl overflow-hidden border-[3px] border-transparent hover:border-orange-200 transition-all shadow-sm">
                      <img src="/static/images/ninjago.jpg" onerror="this.src='https://ui-avatars.com/api/?name=Ninjago&background=ea580c&color=fff&size=300'" class="w-full h-full object-cover">
                      <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex items-end justify-center p-4 transition-colors duration-300">
                          <span class="text-white font-black text-xs sm:text-sm uppercase tracking-widest group-hover:scale-110 transition-transform">Ninjago</span>
                      </div>
                      <div id="check-Ninjago" class="absolute top-3 right-3 bg-white rounded-full shadow-md text-[#ea580c] opacity-0 scale-50 transition-all duration-300 flex items-center justify-center w-8 h-8">
                          <i class="fa-solid fa-circle-check text-2xl"></i>
                      </div>
                  </button>
                  
                  <!-- Marvel -->
                  <button id="cat-btn-Marvel" onclick="toggleSurveyCategory('Marvel')" class="survey-cat-btn group relative aspect-square rounded-3xl overflow-hidden border-[3px] border-transparent hover:border-orange-200 transition-all shadow-sm">
                      <img src="/static/images/marvel.jpg" onerror="this.src='https://ui-avatars.com/api/?name=Marvel&background=ef4444&color=fff&size=300'" class="w-full h-full object-cover">
                      <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex items-end justify-center p-4 transition-colors duration-300">
                          <span class="text-white font-black text-xs sm:text-sm uppercase tracking-widest group-hover:scale-110 transition-transform">Marvel</span>
                      </div>
                      <div id="check-Marvel" class="absolute top-3 right-3 bg-white rounded-full shadow-md text-[#ea580c] opacity-0 scale-50 transition-all duration-300 flex items-center justify-center w-8 h-8">
                          <i class="fa-solid fa-circle-check text-2xl"></i>
                      </div>
                  </button>
                  
                  <!-- Anime -->
                  <button id="cat-btn-Anime" onclick="toggleSurveyCategory('Anime')" class="survey-cat-btn group relative aspect-square rounded-3xl overflow-hidden border-[3px] border-transparent hover:border-orange-200 transition-all shadow-sm">
                      <img src="/static/images/anime.jpg" onerror="this.src='https://ui-avatars.com/api/?name=Anime&background=3b82f6&color=fff&size=300'" class="w-full h-full object-cover">
                      <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex items-end justify-center p-4 transition-colors duration-300">
                          <span class="text-white font-black text-xs sm:text-sm uppercase tracking-widest group-hover:scale-110 transition-transform">Anime</span>
                      </div>
                      <div id="check-Anime" class="absolute top-3 right-3 bg-white rounded-full shadow-md text-[#ea580c] opacity-0 scale-50 transition-all duration-300 flex items-center justify-center w-8 h-8">
                          <i class="fa-solid fa-circle-check text-2xl"></i>
                      </div>
                  </button>

                  <!-- Military -->
                  <button id="cat-btn-Military" onclick="toggleSurveyCategory('Military')" class="survey-cat-btn group relative aspect-square rounded-3xl overflow-hidden border-[3px] border-transparent hover:border-orange-200 transition-all shadow-sm">
                      <img src="/static/images/military.jpg" onerror="this.src='https://ui-avatars.com/api/?name=Military&background=4b5320&color=fff&size=300'" class="w-full h-full object-cover">
                      <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex items-end justify-center p-4 transition-colors duration-300">
                          <span class="text-white font-black text-xs sm:text-sm uppercase tracking-widest group-hover:scale-110 transition-transform">Military</span>
                      </div>
                      <div id="check-Military" class="absolute top-3 right-3 bg-white rounded-full shadow-md text-[#ea580c] opacity-0 scale-50 transition-all duration-300 flex items-center justify-center w-8 h-8">
                          <i class="fa-solid fa-circle-check text-2xl"></i>
                      </div>
                  </button>

                  <!-- Chinese Myth -->
                  <button id="cat-btn-Chinese-Myth" onclick="toggleSurveyCategory('Chinese Myth')" class="survey-cat-btn group relative aspect-square rounded-3xl overflow-hidden border-[3px] border-transparent hover:border-orange-200 transition-all shadow-sm">
                      <img src="/static/images/chinese-myth.jpg" onerror="this.src='https://ui-avatars.com/api/?name=Chinese+Myth&background=b91c1c&color=fff&size=300'" class="w-full h-full object-cover">
                      <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex items-end justify-center p-4 transition-colors duration-300">
                          <span class="text-white font-black text-[11px] sm:text-sm uppercase tracking-widest group-hover:scale-110 transition-transform leading-tight text-center">Chinese Myth</span>
                      </div>
                      <div id="check-Chinese-Myth" class="absolute top-3 right-3 bg-white rounded-full shadow-md text-[#ea580c] opacity-0 scale-50 transition-all duration-300 flex items-center justify-center w-8 h-8">
                          <i class="fa-solid fa-circle-check text-2xl"></i>
                      </div>
                  </button>
                  
                  <!-- Others -->
                  <button id="cat-btn-Others" onclick="toggleSurveyCategory('Others')" class="survey-cat-btn group relative aspect-square rounded-3xl overflow-hidden border-[3px] border-transparent hover:border-orange-200 transition-all shadow-sm">
                      <img src="/static/images/others.jpg" onerror="this.src='https://ui-avatars.com/api/?name=Others&background=10b981&color=fff&size=300'" class="w-full h-full object-cover">
                      <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex items-end justify-center p-4 transition-colors duration-300">
                          <span class="text-white font-black text-xs sm:text-sm uppercase tracking-widest group-hover:scale-110 transition-transform">Others</span>
                      </div>
                      <div id="check-Others" class="absolute top-3 right-3 bg-white rounded-full shadow-md text-[#ea580c] opacity-0 scale-50 transition-all duration-300 flex items-center justify-center w-8 h-8">
                          <i class="fa-solid fa-circle-check text-2xl"></i>
                      </div>
                  </button>
              </div>
          </div>

          <!-- Step 2: Grade Selection -->
          <div id="survey-step-2" class="step-transition step-out max-w-lg mx-auto h-full flex flex-col justify-center pb-20">
              <button onclick="backToSurveyStep1()" class="absolute top-0 left-0 w-10 h-10 flex items-center justify-center bg-gray-50 border border-gray-100 rounded-full text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors z-20 shadow-sm">
                  <i class="fa-solid fa-arrow-left text-sm"></i>
              </button>
              
              <h2 class="text-2xl sm:text-3xl font-black text-center mb-2 font-['Moul'] text-slate-800 mt-6">ជ្រើសរើសប្រភេទ Grade</h2>
              <p class="text-center text-[11px] sm:text-xs text-gray-400 font-extrabold mb-8 uppercase tracking-widest">Select Quality Grade</p>
              
              <div class="grid grid-cols-2 gap-4">
                  <!-- Grade A -->
                  <button onclick="selectSurveyGrade('A')" class="relative flex flex-col items-center justify-center p-8 bg-gradient-to-b from-orange-50 to-white border-2 border-orange-200 rounded-[2rem] hover:border-[#ea580c] hover:shadow-xl hover:shadow-orange-500/10 transition-all group overflow-hidden">
                      <div class="absolute top-0 right-0 bg-orange-500 text-white text-[9px] font-black px-3 py-1.5 rounded-bl-xl uppercase tracking-widest shadow-sm">Premium</div>
                      <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center text-[#ea580c] text-3xl font-black mb-4 shadow-md border border-orange-100 group-hover:scale-110 group-hover:bg-[#ea580c] group-hover:text-white transition-all">A</div>
                      <span class="font-black text-slate-800 text-lg mb-2 uppercase tracking-wider">Grade A</span>
                      <span class="text-[10px] font-bold text-slate-500 bg-white px-3 py-1.5 rounded-lg border border-gray-100 shadow-sm">តម្លៃ 1000 - 8000៛</span>
                  </button>
                  
                  <!-- Grade B -->
                  <button onclick="selectSurveyGrade('B')" class="flex flex-col items-center justify-center p-8 bg-gradient-to-b from-blue-50 to-white border-2 border-blue-200 rounded-[2rem] hover:border-blue-500 hover:shadow-xl hover:shadow-blue-500/10 transition-all group">
                      <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center text-blue-500 text-3xl font-black mb-4 shadow-md border border-blue-100 group-hover:scale-110 group-hover:bg-blue-500 group-hover:text-white transition-all">B</div>
                      <span class="font-black text-slate-800 text-lg mb-2 uppercase tracking-wider">Grade B</span>
                      <span class="text-[10px] font-bold text-slate-500 bg-white px-3 py-1.5 rounded-lg border border-gray-100 shadow-sm">តម្លៃ 1000៛</span>
                  </button>
              </div>
          </div>

      </div>

      <!-- Sticky Bottom Footer for Confirm Button -->
      <div id="survey-footer" class="absolute bottom-0 left-0 w-full bg-white/90 backdrop-blur-md border-t border-gray-100 p-5 shadow-[0_-15px_30px_rgba(0,0,0,0.05)] hidden z-20">
          <button id="confirm-category-btn" onclick="confirmSurveyCategories()" class="w-full max-w-lg mx-auto h-14 bg-slate-900 text-white font-black rounded-2xl shadow-xl shadow-slate-900/20 hover:bg-[#ea580c] hover:shadow-orange-500/30 transition-all uppercase text-xs tracking-wider flex items-center justify-center gap-2">
              <i class="fa-solid fa-check-double text-lg"></i> បន្តទៅមុខ (Confirm Selection)
          </button>
      </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" style="pointer-events: none;" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-[4000] bg-black/90 text-white px-5 py-2.5 rounded-full flex items-center gap-2.5 shadow-2xl opacity-0 transition-all duration-200 scale-90">
    <i id="toast-icon" class="fa-solid fa-circle-check text-green-400 text-sm"></i>
    <span id="toast-text" class="text-[11px] font-bold uppercase tracking-widest font-['Kantumruy_Pro']">Added to Cart</span>
  </div>

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay" style="display: none;" class="fixed inset-0 z-[5000] bg-black/90 backdrop-blur-md hidden flex-col items-center justify-center text-white">
      <div class="w-10 h-10 border-4 border-[#ea580c] border-t-transparent rounded-full animate-spin mb-3"></div>
      <p class="text-[10px] font-black uppercase tracking-[0.3em] font-['Moul']">កំពុងរៀបចំ...</p>
  </div>

  <!-- IMAGE LIGHTBOX VIEWER -->
  <div id="image-viewer-modal" class="fixed inset-0 z-[6000] bg-black/95 hidden flex-col items-center justify-center p-4 backdrop-blur-sm transition-opacity">
      <button onclick="closeImageViewer()" class="absolute top-6 right-6 w-10 h-10 flex items-center justify-center bg-white/10 rounded-full text-white hover:bg-red-500 transition-colors"><i class="fa-solid fa-xmark text-lg"></i></button>
      <img id="viewer-img" src="" class="max-w-full max-h-[80vh] object-contain rounded-xl shadow-2xl">
  </div>

  <!-- 🌟 UNIFIED STICKY HEADER (STORE - BACK BUTTON ON LEFT) 🌟 -->
  <header class="sticky top-0 z-[100] bg-white/95 backdrop-blur-xl border-b border-gray-100 px-3 py-2.5 flex items-center justify-between shadow-sm">
      
      <!-- Left: Back Button -->
      <div class="w-9 h-9 flex items-center justify-center relative shrink-0">
          <a href="/" class="w-9 h-9 flex items-center justify-center bg-gray-50 rounded-full text-gray-500 border border-gray-100 active:scale-90 transition-transform hover:bg-gray-100">
              <i class="fa-solid fa-arrow-left text-xs"></i>
          </a>
      </div>
      
      <!-- Center: Logo + Title -->
      <div class="flex items-center justify-center flex-1 px-2 gap-2.5 min-w-0 cursor-pointer group" onclick="window.scrollTo({top:0, behavior:'smooth'})">
          <img src="/static/images/logo.png" onerror="this.src='/static/images/logo.jpg'" class="w-11 h-11 sm:w-12 sm:h-12 object-contain shrink-0 group-hover:scale-105 transition-transform" alt="Logo">
          <div class="flex flex-col justify-center text-left">
              <h1 class="text-[15px] sm:text-lg font-black text-gray-900 leading-tight tracking-tight font-['Moul'] pb-0.5">
                  សម្ភារៈ <span class="font-['Plus_Jakarta_Sans'] whitespace-nowrap text-slate-600">- Somphea Reak</span>
              </h1>
              <p class="text-[9px] font-extrabold text-[#ea580c] uppercase tracking-widest leading-none mt-0.5">Minifigure Vault</p>
          </div>
      </div>
      
      <!-- Right: Universal Cart Button -->
      <button onclick="if(typeof window.openUniversalCart === 'function') window.openUniversalCart(); else if (typeof window.openCartDrawer === 'function') window.openCartDrawer();" class="relative w-9 h-9 flex items-center justify-center bg-white border border-gray-200 rounded-full text-gray-800 shadow-sm active:scale-90 transition-transform shrink-0 hover:text-[#ea580c]">
          <i class="fa-solid fa-cart-shopping text-xs"></i>
          <span id="cart-badge" class="cart-badge-count absolute -top-1 -right-1 bg-[#ea580c] text-white text-[8px] font-black w-4 h-4 rounded-full flex items-center justify-center shadow-md hidden border border-white">0</span>
      </button>
  </header>

  <!-- SEARCH & CATEGORY PILLS -->
  <section class="bg-white/95 backdrop-blur-xl border-b border-gray-100 sticky top-[57px] z-[95] px-2.5 py-2 space-y-2 shadow-sm">
      <div class="max-w-6xl mx-auto flex items-center gap-2">
          <div class="relative flex-1">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-[10px]"></i>
              <input type="text" id="minifig-search" oninput="handleSearchInput()" placeholder="Search figures..." class="search-input w-full pl-8 pr-7 py-1.5 text-[11px] font-bold outline-none text-gray-900 placeholder-gray-400">
              <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700">
                  <i class="fa-solid fa-circle-xmark text-xs"></i>
              </button>
          </div>
      </div>

      <div class="max-w-6xl mx-auto">
          <div id="category-filters" class="flex overflow-x-auto gap-1.5 scrollbar-hide py-1">
              <!-- Dynamically populated by JS (including the new Filter button) -->
          </div>
      </div>
  </section>

  <!-- COUNTER -->
  <div class="max-w-6xl mx-auto px-3 pt-2.5 flex justify-between items-center text-[9px] font-extrabold text-gray-400 uppercase tracking-widest">
      <span id="results-count">Showing 0 Minifigures</span>
      <span class="text-emerald-600 flex items-center gap-1"><i class="fa-solid fa-circle text-[5px] animate-pulse"></i> In Stock</span>
  </div>

  <!-- 4 PRODUCTS PER ROW GRID -->
  <main class="p-2 sm:p-3 max-w-6xl mx-auto">
      <div id="product-grid" class="grid grid-cols-4 sm:grid-cols-4 lg:grid-cols-6 gap-1.5 sm:gap-2.5">
          <!-- Unpacked single Minifigures render here -->
      </div>
  </main>

  <!-- INCLUDE THE UNIFIED GLOBAL CART COMPONENT -->
  {% include 'components/cart.html' ignore missing %}

  <script>
    const RATE = 4000;
    let rawProducts = [];
    let unpackedFigures = [];
    
    // Store States
    let activeCategories = new Set(['All']); // Using Set for Multi-Select support!
    let activeSearchTerm = '';
    let activeGradeFilter = 'All'; // 'A', 'B', or 'All'
    
    // Survey State
    let surveySelectedCategories = new Set();
    const surveyCats = ['Ninjago', 'Marvel', 'Anime', 'Military', 'Chinese Myth', 'Others'];

    // ==========================================================
    // 1. SURVEY MODAL LOGIC (MULTI-SELECT)
    // ==========================================================
    document.addEventListener('DOMContentLoaded', () => {
        // Only show if they haven't completed it this session
        if (!sessionStorage.getItem('surveyDone')) {
            openSurveyModal();
        } else {
            document.getElementById('survey-modal').classList.add('survey-hidden');
            document.getElementById('survey-modal').style.display = 'none';
        }
    });

    function openSurveyModal() {
        document.body.style.overflow = 'hidden';
        const modal = document.getElementById('survey-modal');
        modal.style.display = 'flex';
        // Request animation frame allows display:flex to apply before opacity/transform changes
        requestAnimationFrame(() => {
            modal.classList.remove('survey-hidden');
        });
        
        // Ensure we reset to step 1
        document.getElementById('survey-step-2').classList.replace('step-in', 'step-out');
        document.getElementById('survey-step-1').classList.replace('step-out', 'step-in');
        
        if (surveySelectedCategories.size > 0) {
            document.getElementById('survey-footer').classList.remove('hidden');
        } else {
            document.getElementById('survey-footer').classList.add('hidden');
        }
    }

    function toggleSurveyCategory(cat) {
        // Format ID string to handle spaces (e.g. 'Chinese Myth' -> 'Chinese-Myth')
        const catId = cat.replace(/\s+/g, '-');
        const btn = document.getElementById(`cat-btn-${catId}`);
        const check = document.getElementById(`check-${catId}`);
        const footer = document.getElementById('survey-footer');

        if (surveySelectedCategories.has(cat)) {
            // Remove selection
            surveySelectedCategories.delete(cat);
            btn.classList.remove('border-[#ea580c]');
            btn.classList.add('border-transparent');
            check.classList.remove('opacity-100', 'scale-100');
            check.classList.add('opacity-0', 'scale-50');
            btn.querySelector('.absolute.inset-0').classList.remove('bg-black/40');
        } else {
            // Add selection
            surveySelectedCategories.add(cat);
            btn.classList.add('border-[#ea580c]');
            btn.classList.remove('border-transparent');
            check.classList.remove('opacity-0', 'scale-50');
            check.classList.add('opacity-100', 'scale-100');
            btn.querySelector('.absolute.inset-0').classList.add('bg-black/40');
        }

        // Show/Hide Confirm Button based on selections
        if (surveySelectedCategories.size > 0) {
            footer.classList.remove('hidden');
        } else {
            footer.classList.add('hidden');
        }
    }

    function confirmSurveyCategories() {
        if (surveySelectedCategories.size === 0) return;
        
        // Hide the footer in step 2
        document.getElementById('survey-footer').classList.add('hidden');
        
        // Slide out Step 1, Slide in Step 2
        const s1 = document.getElementById('survey-step-1');
        const s2 = document.getElementById('survey-step-2');
        s1.classList.remove('step-in');
        s1.classList.add('step-out');
        setTimeout(() => {
            s2.classList.remove('step-out', 'hidden');
            s2.classList.add('step-in');
        }, 100);
    }

    function backToSurveyStep1() {
        const s1 = document.getElementById('survey-step-1');
        const s2 = document.getElementById('survey-step-2');
        s2.classList.remove('step-in');
        s2.classList.add('step-out');
        
        // Show footer again
        setTimeout(() => {
            document.getElementById('survey-footer').classList.remove('hidden');
            s1.classList.remove('step-out');
            s1.classList.add('step-in');
        }, 100);
    }

    function selectSurveyGrade(grade) {
        activeGradeFilter = grade;
        sessionStorage.setItem('surveyDone', 'true');
        
        // Transfer all survey selections into the main store filter!
        activeCategories = new Set(surveySelectedCategories);
        
        closeSurvey();
        
        // Re-render top categories and filter products
        renderCategoryFilters();
        applyFilters();
    }

    function closeSurvey() {
        sessionStorage.setItem('surveyDone', 'true');
        document.body.style.overflow = '';
        const modal = document.getElementById('survey-modal');
        modal.classList.add('survey-hidden');
        setTimeout(() => { modal.style.display = 'none'; }, 500); // Wait for transition
    }

    // ==========================================================
    // 2. STORE LOGIC
    // ==========================================================
    window.addEventListener('focus', () => { if(typeof window.updateCartBadge === 'function') window.updateCartBadge(); });
    window.addEventListener('pageshow', () => { if(typeof window.updateCartBadge === 'function') window.updateCartBadge(); });

    async function fetchProducts() {
        document.getElementById('loadingOverlay').style.display = 'flex';
        try {
            const res = await fetch('/api/products/minifigure');
            const data = await res.json();
            rawProducts = data.products || [];
            
            unpackMinifigureGroups();
            renderCategoryFilters();
            applyFilters();
        } catch (e) {
            console.error("Error loading minifigures", e);
        } finally {
            document.getElementById('loadingOverlay').style.display = 'none';
        }
        if(typeof window.updateCartBadge === 'function') window.updateCartBadge();
    }

    function unpackMinifigureGroups() {
        unpackedFigures = [];
        
        rawProducts.forEach(product => {
            let variants = product.parsed_variants || [];
            if(variants.length === 0 && product.variants) {
                try { variants = typeof product.variants === 'string' ? JSON.parse(product.variants) : product.variants; } catch(e){}
            }

            let discountPercent = parseFloat(product.discount_percent) || 0;

            if (variants && variants.length > 0) {
                variants.forEach((v, vIdx) => {
                    let figureName = v.name && v.name !== `Style ${vIdx + 1}` ? `${v.name}` : product.title;
                    if (!v.name || v.name.startsWith('Style ')) figureName = product.title ? `${product.title} #${vIdx + 1}` : `Minifigure #${product.id}-${vIdx + 1}`;

                    let figureCategory = v.category || product.category || 'General';
                    
                    let basePriceUSD = (parseFloat(v.price) || parseFloat(product.price) || 0);
                    let finalPriceUSD = basePriceUSD;
                    if(discountPercent > 0) { finalPriceUSD = basePriceUSD - (basePriceUSD * discountPercent / 100); }

                    unpackedFigures.push({
                        cartId: `${product.id}-${vIdx}`,
                        productId: product.id,
                        variantIndex: vIdx,
                        title: figureName,
                        originalPriceKHR: basePriceUSD * RATE,
                        priceKHR: finalPriceUSD * RATE,
                        priceUSD: finalPriceUSD, 
                        discountPercent: discountPercent,
                        stock: parseInt(v.stock) || 0,
                        image: v.image || product.thumbnail || product.image,
                        category: figureCategory
                    });
                });
            } else {
                let basePriceUSD = (parseFloat(product.price) || 0);
                let finalPriceUSD = basePriceUSD;
                if(discountPercent > 0) { finalPriceUSD = basePriceUSD - (basePriceUSD * discountPercent / 100); }

                unpackedFigures.push({
                    cartId: `${product.id}-0`,
                    productId: product.id,
                    variantIndex: 0,
                    title: product.title || `Minifigure #${product.id}`,
                    originalPriceKHR: basePriceUSD * RATE,
                    priceKHR: finalPriceUSD * RATE,
                    priceUSD: finalPriceUSD,
                    discountPercent: discountPercent,
                    stock: parseInt(product.stock) || 0,
                    image: product.image || product.thumbnail,
                    category: product.category || 'General'
                });
            }
        });
    }

    function renderCategoryFilters() {
        let catCounts = { 'All': unpackedFigures.length };
        
        surveyCats.forEach(c => catCounts[c] = 0);

        unpackedFigures.forEach(fig => {
            if(fig.category) {
                fig.category.split(',').forEach(c => {
                    const trimmed = c.trim();
                    if(trimmed) catCounts[trimmed] = (catCounts[trimmed] || 0) + 1;
                });
            }
        });

        const container = document.getElementById('category-filters');
        
        let htmlString = `<button onclick="openSurveyModal()" class="px-3 py-1.5 rounded-full bg-white text-gray-700 border border-gray-200 hover:bg-gray-50 flex items-center justify-center shadow-sm shrink-0 transition-all active:scale-95" title="Filter Minifigures">
            <i class="fa-solid fa-sliders text-[11px]"></i>
        </button>`;

        htmlString += `<button onclick="toggleTopCategory('All')" class="px-3.5 py-1.5 rounded-full ${activeCategories.has('All') ? 'bg-gray-900 text-white shadow-md' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'} text-[9px] font-extrabold uppercase tracking-wider whitespace-nowrap transition-all flex items-center shrink-0">All <span class="opacity-60 text-[8px] ml-1">(${catCounts['All']})</span></button>`;

        htmlString += Object.keys(catCounts).map(c => {
            if (c === 'All') return ''; 
            if(catCounts[c] === 0 && !surveyCats.includes(c) && !activeCategories.has(c)) return '';
            
            const isSelected = activeCategories.has(c);
            return `<button onclick="toggleTopCategory('${c}')" class="px-3.5 py-1.5 rounded-full ${isSelected ? 'bg-[#ea580c] text-white shadow-md shadow-orange-500/20 border-[#ea580c]' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'} border text-[9px] font-extrabold uppercase tracking-wider whitespace-nowrap transition-all flex items-center gap-1.5 shrink-0">
                ${isSelected ? '<i class="fa-solid fa-check text-[8px]"></i>' : ''} ${c} <span class="opacity-70 text-[8px]">(${catCounts[c]})</span>
            </button>`;
        }).join('');
        
        container.innerHTML = htmlString;
    }

    function toggleTopCategory(cat) {
        if (cat === 'All') {
            activeCategories.clear();
            activeCategories.add('All');
        } else {
            activeCategories.delete('All');
            
            if (activeCategories.has(cat)) {
                activeCategories.delete(cat);
                if (activeCategories.size === 0) activeCategories.add('All');
            } else {
                activeCategories.add(cat);
            }
        }
        
        activeGradeFilter = 'All'; 
        
        renderCategoryFilters();
        applyFilters();
    }

    function handleSearchInput() {
        const val = document.getElementById('minifig-search').value;
        activeSearchTerm = val.toLowerCase().trim();
        const clearBtn = document.getElementById('clear-search-btn');
        if (activeSearchTerm) clearBtn.classList.remove('hidden');
        else clearBtn.classList.add('hidden');
        applyFilters();
    }

    function clearSearch() {
        document.getElementById('minifig-search').value = '';
        activeSearchTerm = '';
        document.getElementById('clear-search-btn').classList.add('hidden');
        applyFilters();
    }

    function applyFilters() {
        let filtered = unpackedFigures.filter(fig => {
            
            // 1. Multi-Select Category Match Logic
            let matchesCat = false;
            if (activeCategories.has('All')) {
                matchesCat = true;
            } else {
                activeCategories.forEach(cat => {
                    if (cat === 'Others') {
                        if (!['Ninjago', 'Marvel', 'Anime', 'Military', 'Chinese Myth'].some(c => (fig.category || '').includes(c))) {
                            matchesCat = true;
                        }
                    } else {
                        if (fig.category && fig.category.includes(cat)) {
                            matchesCat = true;
                        }
                    }
                });
            }

            // 2. Search Match
            const title = (fig.title || '').toLowerCase();
            const figId = String(fig.productId);
            const matchesSearch = !activeSearchTerm || title.includes(activeSearchTerm) || figId.includes(activeSearchTerm);
            
            // 3. Grade Match (Grade A > 1000 KHR, Grade B <= 1000 KHR)
            let matchesGrade = true;
            if (activeGradeFilter === 'A') {
                matchesGrade = fig.priceKHR > 1000;
            } else if (activeGradeFilter === 'B') {
                matchesGrade = fig.priceKHR <= 1000;
            }

            return matchesCat && matchesSearch && matchesGrade;
        });

        document.getElementById('results-count').innerText = `Showing ${filtered.length} Minifigures`;
        renderProductsGrid(filtered);
    }

    function renderProductsGrid(figures) {
        const grid = document.getElementById('product-grid');
        
        if (figures.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-16 text-gray-400 font-bold uppercase text-xs tracking-widest bg-white rounded-2xl border border-gray-100 shadow-sm mt-4">
                <i class="fa-solid fa-box-open text-3xl mb-3 text-gray-200"></i><br>
                No Minifigures found.<br>
                <button onclick="activeGradeFilter='All'; applyFilters();" class="mt-4 px-4 py-2 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 text-[10px] transition-colors">Clear Grade Filters</button>
            </div>`;
            return;
        }

        grid.innerHTML = figures.map((fig) => {
            const isSoldOut = fig.stock <= 0;
            let badgeHtml = '';
            let priceHtml = '';
            
            if(fig.discountPercent > 0) {
                badgeHtml = `<div class="absolute top-1 left-1 z-10 bg-red-600 text-white text-[8px] font-black px-1.5 py-0.5 rounded-md shadow-sm leading-none">-${Math.round(fig.discountPercent)}%</div>`;
                priceHtml = `
                    <div class="flex flex-col mt-0.5">
                        <span class="text-[8px] font-bold text-gray-400 line-through leading-none mb-0.5">${fig.originalPriceKHR.toLocaleString()}៛</span>
                        <span class="font-black text-[11px] text-red-600 leading-none">${fig.priceKHR.toLocaleString()}៛</span>
                    </div>
                `;
            } else {
                priceHtml = `<span class="font-black text-[11px] text-[#ea580c] block mt-1">${fig.priceKHR.toLocaleString()}៛</span>`;
            }

            return `
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex flex-col relative group ${isSoldOut ? 'opacity-50' : ''}">
                ${badgeHtml}
                <!-- Single Figure Image -->
                <div class="aspect-square bg-slate-50 relative overflow-hidden flex items-center justify-center p-1 cursor-pointer" onclick="openImageViewer('${fig.image}')">
                    ${isSoldOut ? `<div class="absolute inset-0 bg-white/60 backdrop-blur-[1px] flex items-center justify-center z-10"><span class="bg-gray-900 text-white text-[7px] font-black px-2 py-1 rounded shadow-md uppercase tracking-widest">SOLD OUT</span></div>` : ''}
                    <img src="${fig.image}" class="max-w-full max-h-full object-contain mix-blend-multiply group-hover:scale-110 transition-transform duration-300 drop-shadow-sm">
                </div>

                <!-- Box Details -->
                <div class="p-2 flex flex-col flex-grow bg-white justify-between">
                    <div>
                        <!-- UPDATED FONT & SIZE FOR CLASSIC/MODERN LOOK -->
                        <h3 class="font-bold text-[10px] sm:text-[11px] text-gray-800 line-clamp-2 leading-tight mb-1 font-['Plus_Jakarta_Sans'] tracking-wide" title="${fig.title}">${fig.title}</h3>
                        ${priceHtml}
                    </div>

                    <button onclick="addToCartUnpacked('${fig.cartId}')" ${isSoldOut ? 'disabled' : ''} class="w-full mt-2 py-1.5 bg-gray-50 text-gray-700 hover:bg-gray-900 hover:text-white border border-gray-100 ${isSoldOut ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'active:scale-95'} rounded-xl text-[9px] font-extrabold uppercase tracking-wider transition-all flex items-center justify-center gap-1 shadow-sm">
                        <i class="fa-solid fa-cart-plus text-[8px]"></i> Add
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    function addToCartUnpacked(cartId) {
        const figure = unpackedFigures.find(f => f.cartId === cartId);
        if(!figure) return;
        if(figure.stock <= 0) return alert("Sorry, this minifigure is sold out!");

        if (typeof window.addToGlobalCart === 'function') {
            window.addToGlobalCart({
                productId: figure.productId,
                variantId: figure.cartId,
                name: figure.title,
                style: 'Single Figure',
                price: figure.priceUSD, 
                image: figure.image,
                stock: figure.stock,
                type: 'option',
                qty: 1
            });
        }
        
        const toast = document.getElementById('toast');
        document.getElementById('toast-text').innerText = "Added to Cart";
        toast.classList.remove('opacity-0', 'scale-90'); 
        setTimeout(() => toast.classList.add('opacity-0', 'scale-90'), 1200);
    }

    function openImageViewer(src) { document.getElementById('viewer-img').src = src; document.getElementById('image-viewer-modal').classList.remove('hidden'); document.getElementById('image-viewer-modal').classList.add('flex'); }
    function closeImageViewer() { document.getElementById('image-viewer-modal').classList.add('hidden'); document.getElementById('image-viewer-modal').classList.remove('flex'); }

    fetchProducts();
  </script>
</body>
</html>
