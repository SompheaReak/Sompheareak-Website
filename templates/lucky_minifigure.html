<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Where to Next? - Cafe Spinner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appbg: '#0f0f11',
            panel: '#1a1a1c',
            panelLight: '#252528',
            primary: '#d97706', /* Darker amber/orange */
            primaryHover: '#b45309',
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    
    body { 
        font-family: 'Inter', sans-serif; 
        -webkit-tap-highlight-color: transparent; 
        background-color: #0f0f11;
        color: #ffffff;
    }
    
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Horizontal Spinner Track Styles */
    .spinner-viewport {
        position: relative;
        width: 100%;
        height: 240px;
        background: #151518;
        border-radius: 1.5rem;
        overflow: hidden;
        border: 1px solid #2a2a30;
    }

    /* Gradient fading on the edges */
    .spinner-viewport::before, .spinner-viewport::after {
        content: '';
        position: absolute;
        top: 0; bottom: 0;
        width: 60px;
        z-index: 10;
        pointer-events: none;
    }
    .spinner-viewport::before {
        left: 0;
        background: linear-gradient(to right, #151518 10%, transparent);
    }
    .spinner-viewport::after {
        right: 0;
        background: linear-gradient(to left, #151518 10%, transparent);
    }

    #spinner-track {
        display: flex;
        height: 100%;
        align-items: center;
        gap: 16px; /* Spacing between cards */
        /* Padding left gives initial offset so items start from the center */
        padding-left: 50%;
        will-change: transform;
    }

    .cafe-card {
        width: 150px;
        height: 190px;
        flex-shrink: 0;
        border-radius: 1rem;
        background: linear-gradient(180deg, #252528 0%, #151518 100%);
        border: 1px solid #333;
        display: flex;
        flex-col;
        align-items: center;
        padding: 12px;
        position: relative;
        transition: opacity 0.3s;
    }
    
    /* Dynamic Theme Borders */
    .theme-featured { border-top: 2px solid #ef4444; box-shadow: inset 0 20px 30px -20px rgba(239, 68, 68, 0.2); }
    .theme-new { border-top: 2px solid #3b82f6; box-shadow: inset 0 20px 30px -20px rgba(59, 130, 246, 0.2); }
    .theme-regular { border-top: 2px solid #4ade80; box-shadow: inset 0 20px 30px -20px rgba(74, 222, 128, 0.1); }

    .cafe-logo-container {
        width: 70px;
        height: 70px;
        background: white;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 25px;
        margin-bottom: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        overflow: hidden;
    }
    
    .cafe-logo-container img { width: 100%; height: 100%; object-fit: cover; }

    /* Modal Animation */
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0.5; } to { transform: translateY(0); opacity: 1; } }
    .anim-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="pb-10 relative overflow-x-hidden">

  <header class="p-5 flex items-center justify-between z-50 relative">
      <button class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-white transition-colors">
          <i class="fa-solid fa-chevron-left text-xl"></i>
      </button>
      <div class="flex items-center gap-4">
          <button class="text-gray-400 hover:text-white"><i class="fa-solid fa-magnifying-glass text-xl"></i></button>
          <button class="text-gray-400 hover:text-white"><i class="fa-solid fa-ellipsis text-xl"></i></button>
      </div>
  </header>

  <main class="px-5 max-w-md mx-auto flex flex-col items-center">
      
      <div class="text-center mb-6">
          <h1 class="text-3xl font-black tracking-tight mb-1">WHERE TO NEXT?</h1>
          <p class="text-sm text-gray-400">Spin to select your next cafe destination.</p>
      </div>

      <div id="filter-container" class="flex gap-2 w-full overflow-x-auto scrollbar-hide mb-8 border border-gray-800 rounded-xl p-1 bg-[#151518]">
          <button onclick="setFilter('ALL')" class="filter-btn active flex-1 py-2 px-4 rounded-lg text-xs font-bold text-white bg-primary transition-all">ALL</button>
          <button onclick="setFilter('BKK')" class="filter-btn flex-1 py-2 px-4 rounded-lg text-xs font-bold text-gray-500 hover:text-gray-300 transition-all">BKK</button>
          <button onclick="setFilter('TTP')" class="filter-btn flex-1 py-2 px-4 rounded-lg text-xs font-bold text-gray-500 hover:text-gray-300 transition-all">TTP</button>
          <button onclick="setFilter('TK')" class="filter-btn flex-1 py-2 px-4 rounded-lg text-xs font-bold text-gray-500 hover:text-gray-300 transition-all">TK</button>
          <button onclick="setFilter('IFL')" class="filter-btn flex-1 py-2 px-4 rounded-lg text-xs font-bold text-gray-500 hover:text-gray-300 transition-all">IFL</button>
      </div>

      <div class="relative w-full mb-8">
          <!-- The Center Line Indicator -->
          <div class="absolute inset-y-0 left-1/2 -translate-x-1/2 w-[2px] bg-yellow-500 z-20 pointer-events-none"></div>
          <div class="absolute top-0 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[8px] border-r-[8px] border-t-[10px] border-l-transparent border-r-transparent border-t-yellow-500 z-20 pointer-events-none"></div>
          <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[8px] border-r-[8px] border-b-[10px] border-l-transparent border-r-transparent border-b-yellow-500 z-20 pointer-events-none"></div>

          <!-- The actual spinner track -->
          <div class="spinner-viewport shadow-2xl">
              <div id="spinner-track">
                  <!-- JS Injects Cafe Cards Here -->
              </div>
          </div>
          
          <div class="absolute right-[-10px] bottom-[30px] flex flex-col gap-4 z-10">
              <button class="w-10 h-10 bg-panel rounded-full flex items-center justify-center border border-gray-700 text-gray-400 hover:text-white"><i class="fa-regular fa-thumbs-up"></i></button>
              <button class="w-10 h-10 bg-panel rounded-full flex items-center justify-center border border-gray-700 text-gray-400 hover:text-white"><i class="fa-regular fa-comment"></i></button>
              <button class="w-10 h-10 bg-panel rounded-full flex items-center justify-center border border-gray-700 text-gray-400 hover:text-white"><i class="fa-solid fa-share"></i></button>
          </div>
      </div>

      <button id="spin-btn" onclick="startSpinning()" class="w-full max-w-sm bg-primary hover:bg-primaryHover text-black font-black text-sm py-5 rounded-xl shadow-[0_0_20px_rgba(217,119,6,0.3)] active:scale-95 transition-all uppercase tracking-widest mb-10">
          Spin to Select...
      </button>

      <div class="w-full text-left max-w-sm">
          <h3 class="text-[10px] font-bold text-gray-500 tracking-[0.2em] uppercase mb-4">Recent Spins</h3>
          <div id="recent-spins-container" class="space-y-3">
              <!-- Dynamically populated -->
              <div class="text-xs text-gray-600 italic">No recent spins yet.</div>
          </div>
      </div>
  </main>

  <!-- Selected Cafe Modal overlay -->
  <div id="result-modal" class="fixed inset-0 z-[9000] bg-appbg hidden flex-col transition-opacity duration-300 opacity-0">
      
      <div class="p-5 border-b border-gray-800 flex items-start justify-between">
          <div class="flex gap-4">
              <div class="w-14 h-14 bg-white rounded-xl overflow-hidden p-1">
                  <img id="res-logo" src="" class="w-full h-full object-contain rounded-lg">
              </div>
              <div class="pt-1">
                  <p class="text-[10px] text-red-500 font-bold tracking-widest uppercase mb-1">Selected Cafe</p>
                  <h2 id="res-name" class="text-xl font-bold leading-none mb-2">Cafe Name</h2>
                  <span id="res-loc" class="text-[10px] bg-panelLight border border-gray-700 text-gray-300 px-2 py-0.5 rounded-md font-semibold">LOC</span>
              </div>
          </div>
          <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-white bg-panel rounded-full">
              <i class="fa-solid fa-xmark"></i>
          </button>
      </div>

      <div class="flex-1 overflow-y-auto p-5 pb-20">
          <div class="relative w-full h-48 rounded-2xl overflow-hidden mb-6 group">
              <img id="res-image" src="" class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-black/30 flex items-end justify-center pb-4 opacity-0 group-hover:opacity-100 transition-opacity">
                  <button class="bg-black/60 backdrop-blur-md text-white text-xs px-4 py-2 rounded-full flex items-center gap-2"><i class="fa-solid fa-expand"></i> View full screen</button>
              </div>
              <!-- Pagination dots mock -->
              <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5">
                  <div class="w-4 h-1.5 bg-primary rounded-full"></div>
                  <div class="w-1.5 h-1.5 bg-white/40 rounded-full"></div>
                  <div class="w-1.5 h-1.5 bg-white/40 rounded-full"></div>
              </div>
          </div>

          <!-- Actions -->
          <button class="w-full bg-white text-black font-bold py-4 rounded-xl flex items-center justify-center gap-2 mb-3 active:scale-95 transition-transform">
              <i class="fa-solid fa-map-location-dot text-red-500"></i> Google Maps
          </button>
          
          <div class="flex gap-3 mb-8">
              <button class="flex-1 bg-panel border border-gray-700 text-gray-300 font-semibold py-4 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-transform text-sm">
                  <i class="fa-solid fa-ban text-gray-500"></i> Exclude
              </button>
              <button onclick="closeModalAndSpin()" class="flex-1 bg-primary text-black font-bold py-4 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-transform text-sm">
                  <i class="fa-solid fa-rotate-right"></i> Spin Again
              </button>
          </div>

          <div>
              <div class="flex justify-between items-end mb-4">
                  <h3 class="text-[10px] font-bold text-gray-500 tracking-[0.2em] uppercase">Nearby in <span id="res-nearby-loc">LOC</span></h3>
                  <span class="text-[9px] bg-primary/20 text-primary px-2 py-0.5 rounded border border-primary/30 font-bold uppercase">Partner</span>
              </div>
              
              <div class="bg-panel border border-gray-800 rounded-xl p-3 flex items-center justify-between cursor-pointer hover:bg-panelLight transition-colors">
                  <div class="flex items-center gap-3">
                      <div class="w-10 h-10 bg-white rounded-lg p-1"><img src="https://images.unsplash.com/photo-1559925393-8be0ec4767c8?auto=format&fit=crop&w=100&q=80" class="w-full h-full object-cover rounded-md"></div>
                      <span class="font-semibold text-sm">Koi The</span>
                  </div>
                  <i class="fa-solid fa-arrow-right text-gray-600"></i>
              </div>
              <p class="text-center text-[10px] text-gray-600 mt-4 italic">Become a partner & feature your cafe →</p>
          </div>
      </div>
  </div>

  <script>
    // --- Mock Data ---
    const allCafes = [
        { id: 1, name: "Haru Cafe", loc: "BKK", tag: "NEW", tagType: "new", logo: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=150&q=80", image: "https://images.unsplash.com/photo-1600093463592-8e36ae95ef56?auto=format&fit=crop&w=600&q=80" },
        { id: 2, name: "Starbucks", loc: "TTP", tag: "FEATURED", tagType: "featured", logo: "https://images.unsplash.com/photo-1559925393-8be0ec4767c8?auto=format&fit=crop&w=150&q=80", image: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=600&q=80" },
        { id: 3, name: "Sip House", loc: "TK", tag: "", tagType: "regular", logo: "https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?auto=format&fit=crop&w=150&q=80", image: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=600&q=80" },
        { id: 4, name: "Brown Coffee", loc: "BKK", tag: "", tagType: "regular", logo: "https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=150&q=80", image: "https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=600&q=80" },
        { id: 5, name: "Tube Cafe", loc: "IFL", tag: "POPULAR", tagType: "featured", logo: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=150&q=80", image: "https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?auto=format&fit=crop&w=600&q=80" },
        { id: 6, name: "Noir Cafe", loc: "TK", tag: "NEW", tagType: "new", logo: "https://images.unsplash.com/photo-1600093463592-8e36ae95ef56?auto=format&fit=crop&w=150&q=80", image: "https://images.unsplash.com/photo-1559925393-8be0ec4767c8?auto=format&fit=crop&w=600&q=80" }
    ];

    let currentFilter = 'ALL';
    let isSpinning = false;
    let recentSpins = [];
    
    // UI Constants
    const CARD_WIDTH = 150;
    const CARD_GAP = 16;
    const TOTAL_ITEM_WIDTH = CARD_WIDTH + CARD_GAP;

    // --- Core Logic ---

    // Initialize track based on filter
    function setFilter(loc) {
        if(isSpinning) return;
        currentFilter = loc;
        
        // Update button styles
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.className = "filter-btn flex-1 py-2 px-4 rounded-lg text-xs font-bold text-gray-500 hover:text-gray-300 transition-all";
            if(btn.innerText === loc) {
                btn.className = "filter-btn active flex-1 py-2 px-4 rounded-lg text-xs font-bold text-white bg-primary transition-all";
            }
        });

        resetTrack();
    }

    function getFilteredCafes() {
        if(currentFilter === 'ALL') return allCafes;
        return allCafes.filter(c => c.loc === currentFilter);
    }

    function resetTrack() {
        const track = document.getElementById('spinner-track');
        track.style.transition = 'none';
        track.style.transform = `translateX(0px)`;
        track.innerHTML = '';
        
        // Pre-fill some mock items so track isn't empty initially
        const pool = getFilteredCafes();
        if(pool.length === 0) { track.innerHTML = '<div class="text-gray-500 text-sm ml-10">No cafes found in this area.</div>'; return; }
        
        for(let i=0; i<5; i++) {
            track.appendChild(createCardElement(pool[Math.floor(Math.random() * pool.length)]));
        }
    }

    function startSpinning() {
        const pool = getFilteredCafes();
        if(pool.length === 0) return;
        if(isSpinning) return;
        isSpinning = true;

        const btn = document.getElementById('spin-btn');
        btn.innerText = "SELECTING CAFE...";
        btn.classList.add('animate-pulse');

        const track = document.getElementById('spinner-track');
        track.style.transition = 'none';
        track.style.transform = 'translateX(0px)';
        track.innerHTML = '';

        // Generate track items
        const numSpins = 40; // Total elements to generate
        const winIndex = 35; // The index of the winning element
        
        // Ensure winner exists
        const winner = pool[Math.floor(Math.random() * pool.length)];

        for(let i = 0; i < numSpins; i++) {
            let cafe = (i === winIndex) ? winner : pool[Math.floor(Math.random() * pool.length)];
            track.appendChild(createCardElement(cafe));
        }

        // Force browser repaint
        track.offsetHeight; 

        // Calculate translation needed to center the winning item
        // The track has padding-left: 50% which centers the starting point.
        // We need to move left by (winIndex * TOTAL_ITEM_WIDTH) + (CARD_WIDTH / 2).
        
        // Add a slight random offset so it doesn't land dead center every time
        const randomOffset = (Math.random() * 40) - 20; 
        
        // Since the track starts with padding-left 50%, 0px translate means the left edge of item 0 is at center.
        // We want the center of item `winIndex` to be at center.
        const targetX = -(winIndex * TOTAL_ITEM_WIDTH) - (CARD_WIDTH / 2) + randomOffset;

        // Apply transition
        track.style.transition = 'transform 5s cubic-bezier(0.15, 0.85, 0.15, 1)';
        track.style.transform = `translateX(${targetX}px)`;

        setTimeout(() => {
            handleSpinComplete(winner);
        }, 5200);
    }

    function createCardElement(cafe) {
        const div = document.createElement('div');
        div.className = `cafe-card theme-${cafe.tagType}`;
        
        let tagHtml = cafe.tag ? 
            `<span class="absolute top-3 right-3 text-[8px] font-black tracking-wider ${cafe.tagType === 'new' ? 'text-blue-400' : 'text-red-400'} uppercase">${cafe.tag}</span>` : 
            `<span class="absolute top-3 right-3 text-[8px] font-black tracking-wider text-gray-500 uppercase">${cafe.loc}</span>`;
            
        let locHtml = cafe.tag ? 
            `<span class="absolute top-3 left-3 text-[8px] font-black tracking-wider text-gray-600 uppercase">${cafe.loc}</span>` : '';

        div.innerHTML = `
            ${locHtml}
            ${tagHtml}
            <div class="cafe-logo-container"><img src="${cafe.logo}"></div>
            <h3 class="text-sm font-bold text-center leading-tight truncate w-full px-2">${cafe.name}</h3>
            <p class="text-[10px] text-gray-500 mt-1">Cafe</p>
        `;
        return div;
    }

    function handleSpinComplete(winner) {
        const btn = document.getElementById('spin-btn');
        btn.innerText = "Spin to Select...";
        btn.classList.remove('animate-pulse');
        isSpinning = false;

        // Add to recent
        addRecentSpin(winner);

        // Show Modal
        document.getElementById('res-logo').src = winner.logo;
        document.getElementById('res-image').src = winner.image;
        document.getElementById('res-name').innerText = winner.name + " | " + winner.loc;
        document.getElementById('res-loc').innerText = winner.loc;
        document.getElementById('res-nearby-loc').innerText = winner.loc;

        const modal = document.getElementById('result-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        
        // Small delay to allow display:flex to apply before animating opacity
        setTimeout(() => {
            modal.classList.remove('opacity-0');
            modal.firstElementChild.nextElementSibling.classList.add('anim-slide-up');
        }, 10);
    }

    function closeModal() {
        const modal = document.getElementById('result-modal');
        modal.classList.add('opacity-0');
        setTimeout(() => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            resetTrack();
        }, 300);
    }

    function closeModalAndSpin() {
        closeModal();
        setTimeout(() => {
            startSpinning();
        }, 350);
    }

    function addRecentSpin(cafe) {
        recentSpins.unshift(cafe);
        if(recentSpins.length > 3) recentSpins.pop(); // Keep only last 3
        
        const container = document.getElementById('recent-spins-container');
        container.innerHTML = recentSpins.map(c => `
            <div class="flex items-center justify-between bg-panel border border-gray-800 p-2.5 rounded-xl">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white rounded-lg p-1 border border-gray-200">
                        <img src="${c.logo}" class="w-full h-full object-contain rounded">
                    </div>
                    <div>
                        <h4 class="text-sm font-semibold">${c.name}</h4>
                        <p class="text-[10px] text-gray-500">Cafe</p>
                    </div>
                </div>
                <span class="text-xs font-bold text-gray-500 bg-[#0f0f11] px-2 py-1 rounded">${c.loc}</span>
            </div>
        `).join('');
    }

    // Initialize layout on load
    window.onload = () => {
        resetTrack();
    };
  </script>
</body>
</html>
