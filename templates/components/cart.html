<!-- Global Cart Overlay -->
<div id="global-cart-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden opacity-0 transition-opacity duration-300" onclick="closeCart()"></div>

<!-- Global Cart Drawer -->
<div id="global-cart-drawer" class="fixed top-0 right-0 h-[100dvh] w-full max-w-md bg-white z-[110] shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col font-['Plus_Jakarta_Sans']">
    
    <!-- Cart Header -->
    <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-[#ff5000]/10 rounded-full flex items-center justify-center text-[#ff5000]">
                <i class="fa-solid fa-cart-shopping text-lg"></i>
            </div>
            <div>
                <h2 class="text-base font-black text-slate-900">Your Cart</h2>
                <p class="text-[10px] font-bold text-slate-500" id="cart-item-count">0 items across all stores</p>
            </div>
        </div>
        <button onclick="closeCart()" class="w-8 h-8 flex items-center justify-center bg-white border border-slate-200 rounded-full text-slate-400 hover:text-red-500 hover:bg-red-50 transition-all shadow-sm">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <!-- Cart Items Area -->
    <div id="cart-items-container" class="flex-1 overflow-y-auto p-5 space-y-4 hide-scrollbar bg-slate-50/30">
        <!-- Cart items will be generated here by JavaScript -->
        <div id="empty-cart-message" class="h-full flex flex-col items-center justify-center text-center opacity-50 hidden">
            <i class="fa-solid fa-basket-shopping text-4xl mb-3 text-slate-300"></i>
            <p class="text-sm font-bold text-slate-500">Your cart is empty</p>
            <p class="text-[10px] font-semibold text-slate-400 mt-1">Visit our stores to add items!</p>
        </div>
    </div>

    <!-- Redeem Code Section -->
    <div class="px-5 py-3 border-t border-slate-100 bg-white">
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1.5 block">Gift / Redeem Code</label>
        <div class="flex gap-2">
            <input type="text" id="redeem-code-input" placeholder="Enter code here..." class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 outline-none focus:border-[#ff5000] focus:ring-2 focus:ring-orange-500/10 transition-all uppercase">
            <button onclick="applyRedeemCode()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-wider transition-colors shadow-sm">Apply</button>
        </div>
        <p id="redeem-message" class="text-[9px] font-bold mt-1.5 hidden"></p>
    </div>

    <!-- Cart Footer (Totals & Checkout) -->
    <div class="p-5 border-t border-slate-100 bg-white shadow-[0_-10px_40px_rgba(0,0,0,0.03)]">
        <div class="space-y-2 mb-4">
            <div class="flex justify-between items-center text-xs font-bold text-slate-500">
                <span>Subtotal</span>
                <span id="cart-subtotal-usd">$0.00</span>
            </div>
            <div id="discount-row" class="flex justify-between items-center text-xs font-bold text-emerald-500 hidden">
                <span>Discount</span>
                <span id="cart-discount-amount">-$0.00</span>
            </div>
            <div class="pt-2 border-t border-slate-100 flex justify-between items-end">
                <span class="text-sm font-black text-slate-900 uppercase tracking-wider">Total</span>
                <div class="text-right">
                    <div class="text-lg font-black text-[#ff5000]" id="cart-total-usd">$0.00</div>
                    <div class="text-[10px] font-bold text-slate-400" id="cart-total-khr">0 ៛</div>
                </div>
            </div>
        </div>

        <form action="/checkout" method="POST" id="checkout-form">
            <!-- Hidden inputs to pass cart data to backend -->
            <input type="hidden" name="cart_data" id="hidden-cart-data">
            <input type="hidden" name="applied_redeem_code" id="hidden-redeem-code">
            
            <button type="submit" onclick="prepareCheckout(event)" class="w-full bg-[#ff5000] hover:bg-orange-600 text-white py-3.5 rounded-2xl text-xs font-black uppercase tracking-wider shadow-lg shadow-orange-500/20 transition-all flex items-center justify-center gap-2">
                Secure Checkout <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>
</div>

<script>
    // ==========================================
    // GLOBAL CART LOGIC (Shared across all stores)
    // ==========================================
    const EXCHANGE_RATE = 4000;
    
    // Load cart from LocalStorage (persists across pages)
    let globalCart = JSON.parse(localStorage.getItem('universal_store_cart')) || [];
    let currentDiscount = 0; // Value between 0 and 1 (e.g., 0.1 for 10%)
    let activeRedeemCode = "";

    document.addEventListener('DOMContentLoaded', () => {
        renderCart();
        updateCartBadge(); // Call this if you have a cart icon badge in your navbar
    });

    // Toggle UI
    function openCart() {
        document.getElementById('global-cart-overlay').classList.remove('hidden');
        setTimeout(() => document.getElementById('global-cart-overlay').classList.remove('opacity-0'), 10);
        document.getElementById('global-cart-drawer').classList.remove('translate-x-full');
    }

    function closeCart() {
        document.getElementById('global-cart-overlay').classList.add('opacity-0');
        document.getElementById('global-cart-drawer').classList.add('translate-x-full');
        setTimeout(() => document.getElementById('global-cart-overlay').classList.add('hidden'), 300);
    }

    /**
     * Add to Cart Function
     * Automatically handles the "View Only" to "Option" conversion
     */
    window.addToGlobalCart = function(product) {
        // product object structure expected:
        // { productId, variantId, name, price, image, stock, type, mainVariantId }
        
        let targetVariantId = product.variantId;
        
        // Smart Check: If they clicked a "View Only" image, assign it to the Main Thumbnail variant instead
        if (product.type === 'view' && product.mainVariantId) {
            targetVariantId = product.mainVariantId;
            console.log("Redirected view-only click to main variant ID: " + targetVariantId);
        }

        // Check if item already exists in cart
        let existingItem = globalCart.find(item => item.variantId === targetVariantId);

        if (existingItem) {
            if (existingItem.qty < product.stock) {
                existingItem.qty += 1;
            } else {
                alert("Maximum available stock reached for this item.");
                return;
            }
        } else {
            // Add new item
            globalCart.push({
                productId: product.productId,
                variantId: targetVariantId,
                name: product.name,
                price: parseFloat(product.price),
                image: product.image,
                stock: parseInt(product.stock),
                qty: 1
            });
        }

        saveCart();
        renderCart();
        openCart();
    }

    function updateCartQty(variantId, change) {
        let item = globalCart.find(i => i.variantId === variantId);
        if (!item) return;

        let newQty = item.qty + change;
        if (newQty > 0 && newQty <= item.stock) {
            item.qty = newQty;
        } else if (newQty > item.stock) {
            alert("Cannot add more. Stock limit reached.");
        } else if (newQty <= 0) {
            removeFromCart(variantId);
            return;
        }
        
        saveCart();
        renderCart();
    }

    function removeFromCart(variantId) {
        globalCart = globalCart.filter(item => item.variantId !== variantId);
        saveCart();
        renderCart();
    }

    function saveCart() {
        localStorage.setItem('universal_store_cart', JSON.stringify(globalCart));
        updateCartBadge();
    }

    function renderCart() {
        const container = document.getElementById('cart-items-container');
        const emptyMsg = document.getElementById('empty-cart-message');
        const countText = document.getElementById('cart-item-count');
        
        container.innerHTML = '';
        let totalItems = 0;
        let subtotal = 0;

        if (globalCart.length === 0) {
            emptyMsg.classList.remove('hidden');
            container.appendChild(emptyMsg);
            countText.innerText = `0 items across all stores`;
        } else {
            emptyMsg.classList.add('hidden');
            
            globalCart.forEach(item => {
                totalItems += item.qty;
                subtotal += (item.price * item.qty);

                const itemHTML = `
                    <div class="flex gap-3 bg-white p-3 rounded-2xl border border-slate-100 shadow-sm relative group">
                        <div class="w-16 h-16 bg-slate-50 rounded-xl border border-slate-100 p-1 shrink-0 flex items-center justify-center">
                            <img src="${item.image}" class="max-w-full max-h-full object-contain mix-blend-multiply">
                        </div>
                        <div class="flex-1 flex flex-col justify-between py-0.5">
                            <div class="flex justify-between items-start pr-5">
                                <h4 class="text-xs font-extrabold text-slate-900 leading-tight line-clamp-2">${item.name}</h4>
                            </div>
                            <div class="flex justify-between items-end mt-2">
                                <div class="flex items-center gap-2 bg-slate-50 rounded-lg border border-slate-200 p-0.5">
                                    <button onclick="updateCartQty('${item.variantId}', -1)" class="w-6 h-6 flex items-center justify-center text-slate-500 hover:bg-white hover:shadow-sm rounded-md transition-all"><i class="fa-solid fa-minus text-[10px]"></i></button>
                                    <span class="text-xs font-black w-4 text-center text-slate-900">${item.qty}</span>
                                    <button onclick="updateCartQty('${item.variantId}', 1)" class="w-6 h-6 flex items-center justify-center text-slate-500 hover:bg-white hover:shadow-sm rounded-md transition-all"><i class="fa-solid fa-plus text-[10px]"></i></button>
                                </div>
                                <div class="text-right">
                                    <span class="block text-xs font-black text-[#ff5000]">$${(item.price * item.qty).toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                        <button onclick="removeFromCart('${item.variantId}')" class="absolute top-2 right-2 w-6 h-6 flex items-center justify-center text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-full transition-all">
                            <i class="fa-solid fa-trash-can text-[10px]"></i>
                        </button>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', itemHTML);
            });
            countText.innerText = `${totalItems} item(s) in cart`;
        }

        // Calculate Totals
        let discountAmount = subtotal * currentDiscount;
        let finalTotal = subtotal - discountAmount;

        document.getElementById('cart-subtotal-usd').innerText = `$${subtotal.toFixed(2)}`;
        
        if (discountAmount > 0) {
            document.getElementById('discount-row').classList.remove('hidden');
            document.getElementById('cart-discount-amount').innerText = `-$${discountAmount.toFixed(2)}`;
        } else {
            document.getElementById('discount-row').classList.add('hidden');
        }

        document.getElementById('cart-total-usd').innerText = `$${finalTotal.toFixed(2)}`;
        document.getElementById('cart-total-khr').innerText = `${Math.round(finalTotal * EXCHANGE_RATE).toLocaleString()} ៛`;
    }

    // Optional: If you have a cart icon in your header, this updates the red number bubble
    function updateCartBadge() {
        const badges = document.querySelectorAll('.cart-badge-count');
        const totalItems = globalCart.reduce((sum, item) => sum + item.qty, 0);
        badges.forEach(badge => {
            badge.innerText = totalItems;
            if(totalItems > 0) badge.classList.remove('hidden');
            else badge.classList.add('hidden');
        });
    }

    // Simulated Redeem Code check (Your actual validation will happen on the backend)
    function applyRedeemCode() {
        const input = document.getElementById('redeem-code-input').value.trim().toUpperCase();
        const msg = document.getElementById('redeem-message');
        
        if(input === "") return;

        // Note: The logic that a code is "disactive only if admin clicks confirm order" 
        // means this frontend should just pass the code to the backend. The backend will 
        // verify if the code has been used/confirmed yet.
        
        // For visual preview purposes only on frontend:
        if (input === "DISCOUNT10") {
            currentDiscount = 0.10;
            activeRedeemCode = input;
            msg.innerText = "10% Code applied successfully!";
            msg.className = "text-[9px] font-bold mt-1.5 text-emerald-500";
        } else {
            // Reset
            currentDiscount = 0;
            activeRedeemCode = input; // We still pass it so the backend can check it!
            msg.innerText = "Code attached. Will be validated at checkout.";
            msg.className = "text-[9px] font-bold mt-1.5 text-blue-500";
        }
        
        msg.classList.remove('hidden');
        renderCart();
    }

    function prepareCheckout(e) {
        if (globalCart.length === 0) {
            e.preventDefault();
            alert("Your cart is empty!");
            return;
        }
        
        // Load the localstorage array into the hidden form field to send to your Python backend
        document.getElementById('hidden-cart-data').value = JSON.stringify(globalCart);
        document.getElementById('hidden-redeem-code').value = document.getElementById('redeem-code-input').value.toUpperCase();
    }
</script>
