<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Somphea Reak | Premium Studio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Moul&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', 'Kantumruy Pro', sans-serif; 
            background-color: #fcfbf9;
            -webkit-tap-highlight-color: transparent;
        }
        
        h1, .khmer-title { font-family: 'Moul', serif; }

        /* Premium Unified Background */
        .pka-chan-bg {
            background-color: #fdfbf7;
            background-image: radial-gradient(#ea580c 0.5px, transparent 0.5px), radial-gradient(#ea580c 0.5px, #fdfbf7 0.5px);
            background-size: 20px 20px; background-position: 0 0, 10px 10px; opacity: 0.3;
            position: fixed; inset: 0; z-index: -1;
        }

        /* Stunning Card Animations */
        .category-card { 
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
            transform: translateZ(0); 
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1); 
        }
        .category-card:active { transform: scale(0.96); box-shadow: 0 5px 15px -5px rgba(0,0,0,0.1); }
        .category-card img { transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .category-card:hover img { transform: scale(1.08); }
        
        .gradient-overlay { background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.05) 100%); }
        .gradient-overlay-side { background: linear-gradient(to right, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 60%, transparent 100%); }
        
        /* Shimmer Effect for Hot Items */
        .shimmer { position: relative; overflow: hidden; }
        .shimmer::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg); animation: shimmer-anim 3.5s infinite linear; z-index: 10; pointer-events: none;
        }
        @keyframes shimmer-anim { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }
        
        /* Glassmorphism Floating Nav */
        .glass-nav {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body class="text-gray-900 pb-32 select-none relative">

    <div class="pka-chan-bg"></div>

    <!-- 🌟 PREMIUM HEADER 🌟 -->
    <header class="sticky top-0 z-[100] bg-white/95 backdrop-blur-xl border-b border-gray-100 px-4 py-3 flex items-center justify-between shadow-sm">
        
        <button onclick="toggleLang()" class="w-10 h-10 flex items-center justify-center bg-gray-50 rounded-full text-xs font-black text-gray-500 border border-gray-100 active:scale-90 transition-transform shrink-0 shadow-inner">
            <span id="lang-btn-text">KH</span>
        </button>
        
        <div class="flex items-center justify-center flex-1 px-2 gap-3 min-w-0">
            <img src="static/images/logo.png" onerror="this.src='https://ui-avatars.com/api/?name=SR&background=ea580c&color=fff&rounded=true'" class="w-10 h-10 sm:w-12 sm:h-12 object-contain drop-shadow-md shrink-0 rounded-full" alt="Logo">
            <div class="flex flex-col justify-center text-left">
                <h1 class="text-[16px] sm:text-lg font-black text-gray-900 leading-normal tracking-tight font-['Moul'] pb-0.5">
                    សម្ភារៈ <span class="font-['Plus_Jakarta_Sans'] text-sm sm:text-base whitespace-nowrap">- Somphea Reak</span>
                </h1>
                <p class="text-[10px] font-bold text-[#ea580c] uppercase tracking-[0.15em] leading-none">Home Studio</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2 shrink-0">
            <!-- Global Cart Hook -->
            <button onclick="window.openCartDrawer()" class="relative w-10 h-10 flex items-center justify-center bg-white border border-gray-200 rounded-full text-gray-800 shadow-sm active:scale-90 transition-transform">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge-count absolute -top-1 -right-1 bg-[#ea580c] text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center shadow-md hidden">0</span>
            </button>
        </div>
    </header>

    <!-- 🌟 HERO WELCOME BANNER 🌟 -->
    <section class="px-4 pt-6 pb-2">
        <div class="w-full bg-gradient-to-br from-gray-900 via-gray-800 to-black rounded-[2rem] p-6 text-white relative overflow-hidden shadow-2xl shadow-gray-900/20 border border-gray-800">
            <div class="absolute top-0 right-0 w-32 h-32 bg-[#ea580c] rounded-full blur-[60px] opacity-30 -mr-10 -mt-10"></div>
            <div class="relative z-10">
                <span class="bg-white/10 text-white text-[9px] font-black uppercase tracking-widest px-3 py-1 rounded-full border border-white/20 backdrop-blur-md" data-en="Welcome back" data-kh="សូមស្វាគមន៍">Welcome back</span>
                <h2 class="text-2xl font-black mt-4 leading-tight font-['Moul'] tracking-wide" data-en="Discover Our Latest Collections" data-kh="ស្វែងរកកូឡិកសិនថ្មីៗរបស់យើង">Discover Our<br><span class="text-[#ea580c] font-['Plus_Jakarta_Sans']">Latest</span> Collections</h2>
            </div>
        </div>
    </section>

    <!-- 🌟 STOREFRONTS GRID 🌟 -->
    <section class="px-4 pt-4 space-y-4 relative z-10">
        <div class="flex items-center justify-between px-2">
            <h2 class="font-black text-xs uppercase tracking-[0.2em] text-gray-500" data-en="Explore Studio" data-kh="រុករកស្ទូឌីយោ">Explore Studio</h2>
            <div class="h-px flex-grow ml-4 bg-gray-200/60"></div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            
            <!-- 1. CUSTOM BRACELET (Hero Item) -->
            <a href="/custom_bracelet" class="category-card shimmer relative col-span-2 aspect-[21/9] rounded-[2rem] overflow-hidden group cursor-pointer block ring-1 ring-inset ring-black/5 bg-gray-100">
                <img src="https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&q=80&w=800" class="w-full h-full object-cover mix-blend-multiply">
                <div class="gradient-overlay-side absolute inset-0 flex flex-col justify-center p-6">
                    <div class="flex gap-2 mb-2 z-10">
                        <span class="bg-[#ea580c] text-white text-[8px] font-black uppercase px-2 py-1 rounded-lg w-fit border border-orange-400 shadow-[0_0_15px_rgba(234,88,12,0.6)] flex items-center gap-1 animate-pulse"><i class="fa-solid fa-fire"></i> Hot</span>
                        <span class="bg-white/20 backdrop-blur-md text-white text-[8px] font-black uppercase px-2 py-1 rounded-lg w-fit border border-white/30">DIY Studio</span>
                    </div>
                    <h3 class="text-white font-black text-xl md:text-2xl uppercase italic leading-tight drop-shadow-lg relative z-10" data-en="Customize Italy Charm Bracelet" data-kh="រចនាខ្សែដៃអុីតាលី">Customize Italy<br>Charm Bracelet</h3>
                    <p class="text-gray-300 text-[10px] font-bold uppercase mt-1.5 tracking-widest relative z-10 text-orange-300">Design Your Own • Interactive</p>
                </div>
            </a>

            <!-- 2. MINIFIGURES (LEGO) -->
            <a href="/minifigure" class="category-card relative col-span-1 aspect-[4/5] rounded-[2rem] overflow-hidden group cursor-pointer block ring-1 ring-inset ring-black/5 bg-gray-900">
                <div class="absolute top-3 right-3 z-20 w-8 h-8 bg-red-600/90 backdrop-blur-md rounded-full flex items-center justify-center border border-red-400 text-white shadow-lg"><i class="fa-solid fa-chevron-right text-xs"></i></div>
                <img src="https://images.unsplash.com/photo-1518331647614-7a1f04cd34ce?auto=format&fit=crop&q=80&w=600" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 opacity-80">
                <div class="gradient-overlay absolute inset-0 flex flex-col justify-end p-5">
                    <!-- CSS Custom LEGO Logo -->
                    <div class="mb-1 ml-1">
                        <div class="relative inline-flex items-center justify-center bg-[#E3000B] border-[2px] border-black rounded px-2.5 py-1 shadow-lg">
                            <div class="absolute inset-[1px] border-[1.5px] border-[#FFCF00] rounded-[2px] pointer-events-none"></div>
                            <span class="font-black italic text-white text-xl tracking-tighter leading-none relative z-10 drop-shadow-sm" style="text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;">LEGO</span>
                        </div>
                    </div>
                    <h3 class="text-white font-black text-xs uppercase tracking-[0.2em] drop-shadow-md mt-2 ml-2 font-['Moul']" data-en="Minifigures" data-kh="យូនីវើស">Minifigures</h3>
                </div>
            </a>

            <!-- 3. TOY UNIVERSE -->
            <a href="/toy" class="category-card relative col-span-1 aspect-[4/5] rounded-[2rem] overflow-hidden group cursor-pointer block ring-1 ring-inset ring-black/5">
                <div class="absolute top-3 right-3 z-20 w-8 h-8 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center border border-white/30 text-white"><i class="fa-solid fa-chevron-right text-xs"></i></div>
                <img src="https://images.unsplash.com/photo-1566576912321-d58ddd7a6088?auto=format&fit=crop&q=80&w=600" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                <div class="gradient-overlay absolute inset-0 flex flex-col justify-end p-5">
                    <h3 class="text-white font-black text-lg md:text-xl uppercase leading-tight font-['Moul'] drop-shadow-md" data-en="Toy Universe" data-kh="ពិភពប្រដាប់ក្មេងលេង">Toy<br>Universe</h3>
                </div>
            </a>

            <!-- 4. READY-MADE BRACELETS -->
            <a href="/bracelet" class="category-card relative col-span-2 aspect-[21/9] rounded-[2rem] overflow-hidden group cursor-pointer block ring-1 ring-inset ring-black/5 bg-gray-100">
                <div class="absolute top-3 right-3 z-20 w-8 h-8 bg-black/40 backdrop-blur-md rounded-full flex items-center justify-center border border-white/20 text-white"><i class="fa-solid fa-chevron-right text-xs"></i></div>
                <img src="https://images.unsplash.com/photo-1611591437281-460bfbe1220a?auto=format&fit=crop&q=80&w=800" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                <div class="gradient-overlay-side absolute inset-0 flex flex-col justify-center p-6">
                    <h3 class="text-white font-black text-xl md:text-2xl uppercase leading-tight font-['Moul'] drop-shadow-md" data-en="Ready-Made Bracelets" data-kh="ខ្សែក និងខ្សែដៃ">Ready-Made<br>Bracelets</h3>
                    <p class="text-orange-200 text-[10px] font-bold uppercase mt-1 tracking-widest drop-shadow-sm">Jade & Gems Collections</p>
                </div>
            </a>
        </div>
    </section>

    <!-- 🌟 PREMIUM FLOATING BOTTOM NAV 🌟 -->
    <nav class="fixed bottom-6 left-4 right-4 sm:left-auto sm:right-auto sm:w-[400px] sm:left-1/2 sm:-translate-x-1/2 h-16 glass-nav rounded-2xl flex items-center justify-around px-2 z-40">
        <!-- Home (Active) -->
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="w-14 h-12 flex items-center justify-center text-[#ea580c] flex-col gap-1 active:scale-95 transition-transform">
            <i class="fa-solid fa-house text-lg drop-shadow-sm"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Home</span>
        </button>
        
        <!-- Quick Studio Jump -->
        <a href="/custom_bracelet" class="relative w-14 h-14 bg-black rounded-full flex items-center justify-center text-white -translate-y-5 border-4 border-[#fcfbf9] shadow-xl active:scale-95 transition-all hover:bg-[#ea580c] group">
            <div class="absolute inset-0 bg-[#ea580c] rounded-full blur-md opacity-0 group-hover:opacity-40 transition-opacity"></div>
            <i class="fa-solid fa-wand-magic-sparkles text-xl relative z-10 group-hover:animate-spin-slow"></i>
        </a>
        
        <!-- My Orders / History (Connects directly to the Cart component's history drawer!) -->
        <button onclick="if(typeof openOrderHistory === 'function') openOrderHistory(); else window.openCartDrawer();" class="w-14 h-12 flex items-center justify-center text-gray-500 hover:text-[#ea580c] flex-col gap-1 active:scale-95 transition-colors">
            <i class="fa-solid fa-receipt text-lg"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Orders</span>
        </button>
    </nav>

    <!-- ========================================== -->
    <!-- INCLUDE THE UNIFIED GLOBAL CART COMPONENT  -->
    <!-- This replaces all the old cart HTML/JS     -->
    <!-- ========================================== -->
    {% include 'components/cart.html' %}

    <!-- LIGHTWEIGHT PAGE SCRIPTS -->
    <script>
        // Multi-Language System
        let currentLang = localStorage.getItem('app_lang') || 'kh';
        
        function applyLanguage() {
            document.getElementById('lang-btn-text').innerText = currentLang === 'en' ? 'KH' : 'EN';
            document.querySelectorAll('[data-en]').forEach(el => {
                el.innerHTML = currentLang === 'kh' ? el.getAttribute('data-kh') : el.getAttribute('data-en');
            });
            // Update Cart Header if it exists in the component
            const cartHeader = document.querySelector('#universal-cart-drawer h2');
            if (cartHeader && cartHeader.getAttribute('data-en')) {
                cartHeader.innerHTML = currentLang === 'kh' ? cartHeader.getAttribute('data-kh') : cartHeader.getAttribute('data-en');
            }
        }

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'kh' : 'en';
            localStorage.setItem('app_lang', currentLang);
            applyLanguage();
        }

        // Initialize UI
        document.addEventListener('DOMContentLoaded', () => {
            applyLanguage();
            // Force an update to the cart badge on page load
            if(typeof window.updateCartBadge === 'function') {
                window.updateCartBadge();
            }
        });
    </script>
</body>
</html>
