services:
  - type: web
    name: flask-shop
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 2 --threads 4 --worker-class gthread --max-requests 500 --max-requests-jitter 50 --timeout 60"
    envVars:
      - key: TELEGRAM_SERVICE_URL
        fromService:
          type: web
          name: telegram-alert
          property: hostport
  - type: web
    name: telegram-alert
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn telegram_service:app --host 0.0.0.0 --port $PORT"

